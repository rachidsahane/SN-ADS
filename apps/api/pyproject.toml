[project]
name = "soronua-predict-api"
version = "0.1.0"
description = "Soro Nua Campaign Predictor: API and worker (FastAPI, XGBoost)"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi==0.142.2",
    "uvicorn[standard]==0.34.3",
    "pydantic==2.10.6",
    "pydantic-settings==2.7.1",
    "python-multipart==0.0.31",
    "supabase==2.10.0",
    "pyjwt[crypto]==2.15.1",
    "redis==5.2.1",
    "xgboost==2.1.4",
    "numpy==2.2.6",
    "pandas==2.2.3",
    "scikit-learn==1.6.1",
    "sentry-sdk[fastapi]==2.19.2",
    "structlog==24.4.0",
    "httpx==0.27.2",
]

[dependency-groups]
dev = [
    "pytest==9.1.1",
    "pytest-cov==6.0.0",
    "ruff==0.8.6",
    "mypy==1.14.1",
    "pip-audit==2.7.3",
    "pandas-stubs==2.2.3.250527",
]
notebooks = [
    "ipykernel==7.4.0",
    "jupyterlab==4.6.4",
    "matplotlib==3.11.2",
    "nbconvert==7.17.1",
    "nbformat==5.11.1",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["."]

[tool.ruff.format]
quote-style = "double"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "N", "S", "SIM", "RUF", "PL", "C90"]

[tool.ruff.lint.mccabe]
max-complexity = 10

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["fastapi.Depends", "fastapi.Query", "fastapi.Path", "fastapi.Header", "fastapi.Body"]

[tool.ruff.lint.isort]
known-first-party = ["app"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "PLR2004"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
files = ["app"]
warn_unreachable = true

[[tool.mypy.overrides]]
module = ["sklearn.*"]
ignore_missing_imports = true

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true
warn_required_dynamic_aliases = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra --strict-markers --strict-config"
filterwarnings = [
    "error",
    "ignore:Using `httpx` with `starlette.testclient` is deprecated:starlette.exceptions.StarletteDeprecationWarning",
    "ignore:The `gotrue` package is deprecated:DeprecationWarning",
]
markers = ["integration: needs the local container stack"]

[tool.coverage.run]
source = ["app"]
branch = true

[tool.coverage.report]
fail_under = 85
show_missing = true
skip_empty = true
exclude_also = ["if TYPE_CHECKING:", "raise NotImplementedError"]
