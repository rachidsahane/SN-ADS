ht: 600;\n  font-display: swap;\n  src: url(\"3f9611c8-3e38-44a2-b94b-c77302eace6c\") format('woff2');\n  unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;\n}\n\n\n:root {\n  --color-bg: #f2f2f3;\n  --color-surface: #e9e9ea;\n  --color-text: #1d1f20;\n  --color-accent: #5980a6;\n  --color-accent-2: #728fab;\n  --color-divider: color-mix(in srgb, #1d1f20 16%, transparent);\n\n  /* Tonal ramps — generated in OKLCH on one shared lightness scale, so the\n     same step of any role matches the others in visual value. */\n  --color-neutral-100: #f5f5f8;\n  --color-neutral-200: #e7e7ea;\n  --color-neutral-300: #d4d4d7;\n  --color-neutral-400: #b7b7ba;\n  --color-neutral-500: #98989b;\n  --color-neutral-600: #7a7a7d;\n  --color-neutral-700: #5d5d60;\n  --color-neutral-800: #424244;\n  --color-neutral-900: #2b2b2d;\n\n  --color-accent-100: #eef6ff;\n  --color-accent-200: #d6ebff;\n  --color-accent-300: #b5d9fd;\n  --color-accent-400: #94bce3;\n  --color-accent-500: #749dc4;\n  --color-accent-600: #597ea3;\n  --color-accent-700: #416180;\n  --color-accent-800: #2c455d;\n  --color-accent-900: #1d2d3d;\n\n  --color-accent-2-100: #eef6ff;\n  --color-accent-2-200: #d6ebff;\n  --color-accent-2-300: #bdd8f2;\n  --color-accent-2-400: #9ebbd8;\n  --color-accent-2-500: #7e9cb8;\n  --color-accent-2-600: #627d98;\n  --color-accent-2-700: #486077;\n  --color-accent-2-800: #314457;\n  --color-accent-2-900: #1f2d3a;\n\n  --font-heading: \"Barlow Condensed\", system-ui, sans-serif;\n  --font-heading-weight: 600;\n  --font-body: \"Barlow\", system-ui, sans-serif;\n\n  --space-1: 3.4px;\n  --space-2: 6.8px;\n  --space-3: 10.2px;\n  --space-4: 13.6px;\n  --space-6: 20.4px;\n  --space-8: 27.2px;\n\n  --radius-sm: 2px;\n  --radius-md: 4px;\n  --radius-lg: 7px;\n\n  /* Elevation — derived from the ground: soft ink-tinted shadows on a\n     light theme, a hairline edge + ambient darkness on a dark one. */\n  --shadow-sm: 0 1px 2px color-mix(in srgb, #2b2b2d 14%, transparent);\n  --shadow-md: 0 3px 10px color-mix(in srgb, #2b2b2d 16%, transparent);\n  --shadow-lg: 0 12px 32px color-mix(in srgb, #2b2b2d 22%, transparent);\n}\n\nbody {\n  background: var(--color-bg);\n  color: var(--color-text);\n  font-family: var(--font-body);\n}\nh1, h2, h3, h4 { font-family: var(--font-heading); font-weight: var(--font-heading-weight); }\n\n.blueprint {\n  position: relative;\n  border: 1px solid var(--color-divider);\n  border-radius: 0;\n}\n/* The overlay image treatments (halftone, duotone) clip their overlay\n   (overflow:hidden); a blueprint wrapper draws its registration marks\n   outside the box, so when both classes share a wrapper the frame must\n   win. */\n.blueprint.halftone, .blueprint.plate, .blueprint.duotone { overflow: visible; }\n.blueprint > .corner {\n  position: absolute; width: 11px; height: 11px;\n  color: color-mix(in srgb, var(--color-text) 55%, transparent);\n}\n.blueprint > .corner::before, .blueprint > .corner::after {\n  content: \"\"; position: absolute; background: currentColor;\n}\n.blueprint > .corner::before { left: 5px; top: 0; width: 1px; height: 100%; }\n.blueprint > .corner::after  { top: 5px; left: 0; width: 100%; height: 1px; }\n.blueprint > .corner.tl { top: -6px; left: -6px; }\n.blueprint > .corner.tr { top: -6px; right: -6px; }\n.blueprint > .corner.bl { bottom: -6px; left: -6px; }\n.blueprint > .corner.br { bottom: -6px; right: -6px; }\n\n.duotone{position:relative;overflow:hidden}\n.duotone::after{content:\"\";position:absolute;inset:0;pointer-events:none;\n  background:var(--color-accent);mix-blend-mode:color}\n\n/* ══════════════════════════════════════════════════════════════════════════\n   Components — built with the tokens above. Plain CSS\n   on plain HTML: no JavaScript, no build step. Each class is documented in\n   readme.md and demonstrated in foundations/ and components/.\n   ══════════════════════════════════════════════════════════════════════ */\n\n*, *::before, *::after { box-sizing: border-box; }\nbody { margin: 0; font-size: 15px; line-height: 1.55; font-weight: 400; }\nh1, h2, h3, h4, h5, h6 {\n  font-family: var(--font-heading); font-weight: var(--font-heading-weight);\n  line-height: 1.12; letter-spacing: -0.015em; margin: 0 0 var(--space-2);\n}\nh1 { font-size: 42px; }\nh2 { font-size: 32px; }\nh3 { font-size: 25px; }\nh4 { font-size: 20px; }\nh5 { font-size: 16px; }\nh6 { font-size: 13px; }\nh6 { letter-spacing: 0.08em; text-transform: uppercase; }\np { margin: 0 0 var(--space-3); }\na { color: var(--color-accent); text-underline-offset: 3px; }\nimg { display: block; max-width: 100%; }\nfigure { margin: 0; }\nfigcaption {\n  font-size: 11px; margin-top: var(--space-1);\n  color: color-mix(in srgb, var(--color-text) 55%, transparent);\n}\n.text-muted { color: color-mix(in srgb, var(--color-text) 55%, transparent); }\n:focus { outline: none; }\n:focus-visible { outline: 2px solid var(--color-accent); outline-offset: 2px; }\n::selection { background: color-mix(in srgb, var(--color-accent) 30%, transparent); }\n\n/* — rules — */\n.hr {\n  height: 1px; border: 0; margin: var(--space-4) 0;\n  background: var(--color-divider);\n}\n\n/* — buttons — */\n.btn {\n  display: inline-flex; align-items: center; justify-content: center; gap: 6px;\n  cursor: pointer; text-decoration: none;\n  font-family: var(--font-heading); font-weight: var(--font-heading-weight);\n  font-size: 14px; line-height: 1.2; color: var(--color-text); /* matches the .input's 14px —\n     the pair sits side by side in sign-up rows */\n  background: transparent; border: 1px solid transparent;\n  padding: var(--space-2) calc(var(--space-3) * 1.2);\n  border-radius: var(--radius-md);\n}\n.btn svg { display: block; }\n.btn:disabled { opacity: 0.45; cursor: not-allowed; }\n.btn-primary { background: var(--color-accent); color: var(--color-bg); }\n.btn-primary:hover { background: var(--color-accent-600); }\n.btn-primary:active { background: var(--color-accent-700); }\n.btn-secondary { border-color: var(--color-divider); }\n.btn-secondary:hover { background: color-mix(in srgb, var(--color-text) 7%, transparent); }\n.btn-secondary:active { background: color-mix(in srgb, var(--color-text) 14%, transparent); }\n.btn-ghost { color: var(--color-accent); padding-inline: var(--space-1); }\n.btn-ghost:hover { background: color-mix(in srgb, var(--color-accent) 10%, transparent); }\n.btn-ghost:active { background: color-mix(in srgb, var(--color-accent) 18%, transparent); }\n.btn-icon { width: 36px; height: 36px; padding: 0; }\n.btn-block { width: 100%; margin-top: var(--space-2); }\n\n/* — forms — */\n.field > label {\n  display: block; font-size: 12px; margin-bottom: 5px;\n  color: color-mix(in srgb, var(--color-text) 70%, transparent);\n}\n.input {\n  width: 100%; min-height: 36px; padding: 6px 10px; font: inherit;\n  font-size: 14px; color: var(--color-text); caret-color: var(--color-accent);\n  background: var(--color-surface);\n  border: 1px solid var(--color-divider); border-radius: var(--radius-md);\n}\n.input:hover { border-color: color-mix(in srgb, var(--color-text) 45%, transparent); }\n.input:focus-visible { border-color: var(--color-accent); outline-offset: 0; }\ntextarea.input { min-height: 90px; resize: vertical; }\n.radio { display: inline-flex; align-items: center; gap: 8px; cursor: pointer; font-size: 14px; }\n.radio input, .seg-opt input {\n  position: absolute; opacity: 0; width: 0; height: 0; pointer-events: none;\n}\n.radio .dot {\n  width: 16px; height: 16px; flex: none; border-radius: 50%;\n  border: 1.5px solid var(--color-divider);\n}\n.radio:hover .dot { border-color: var(--color-accent); }\n.radio input:checked + .dot {\n  border-color: var(--color-accent); background: var(--color-accent);\n  box-shadow: inset 0 0 0 4px var(--color-bg);\n}\n.radio input:focus-visible + .dot { outline: 2px solid var(--color-accent); outline-offset: 2px; }\n.seg {\n  display: inline-flex; overflow: hidden;\n  border: 1px solid var(--color-divider); border-radius: var(--radius-md);\n}\n.seg-opt {\n  display: inline-flex; align-items: center; gap: 6px;\n  padding: 7px 12px; font-size: 13px; cursor: pointer;\n}\n.seg-opt + .seg-opt { border-left: 1px solid var(--color-divider); }\n.seg-opt:has(input:checked) { background: var(--color-accent); color: var(--color-bg); }\n.seg-opt:not(:has(input:checked)):hover { background: color-mix(in srgb, var(--color-text) 7%, transparent); }\n.seg-opt:has(input:focus-visible) { outline: 2px solid var(--color-accent); outline-offset: -2px; }\n\n/* — cards — */\n.card {\n  display: flex; flex-direction: column; gap: var(--space-2);\n  padding: var(--space-3); border-radius: var(--radius-md); background: var(--color-surface);\n}\n.card-kicker { font-size: 10px; letter-spacing: 0.1em; text-transform: uppercase; color: var(--color-accent); }\n.card-title {\n  font-family: var(--font-heading); font-weight: var(--font-heading-weight);\n  font-size: 17px; line-height: 1.2;\n}\n.card-body { margin: 0; font-size: 13px; opacity: 0.8; flex: 1; }\n.card-meta {\n  display: flex; align-items: center; gap: 6px; font-size: 11px;\n  color: color-mix(in srgb, var(--color-text) 50%, transparent);\n}\n.elev-sm { box-shadow: var(--shadow-sm); }\n.elev-md { box-shadow: var(--shadow-md); }\n.elev-lg { box-shadow: var(--shadow-lg); }\n\n/* — tags — */\n.tag {\n  display: inline-flex; align-items: center; font-size: 11px;\n  letter-spacing: 0.02em; padding: 3px 10px;\n  border-radius: calc(var(--radius-md) * 0.75);\n}\n.tag-accent { background: var(--color-accent-100); color: var(--color-accent-800); }\n.tag-accent-2 { background: var(--color-accent-2-100); color: var(--color-accent-2-800); }\n.tag-neutral { background: var(--color-neutral-100); color: var(--color-neutral-800); }\n.tag-outline { border: 1px solid var(--color-accent); color: var(--color-accent); }\n\n/* — navigation — */\n.nav {\n  display: flex; align-items: center; gap: var(--space-4);\n  padding: var(--space-3) var(--space-4);\n  border-bottom: none;\n}\n.nav-brand {\n  font-family: var(--font-heading); font-weight: var(--font-heading-weight);\n  font-size: 18px; margin-right: auto;\n}\n.nav a { color: inherit; text-decoration: none; font-size: 14px; }\n.nav a:hover, .nav a[aria-current='page'] { color: var(--color-accent); }\n\n/* — tables — */\n.table { width: 100%; border-collapse: collapse; font-size: 14px; }\n.table th {\n  text-align: left; font-size: 11px; letter-spacing: 0.08em; text-transform: uppercase;\n  color: color-mix(in srgb, var(--color-text) 60%, transparent);\n  padding: var(--space-2); border-bottom: 1px solid var(--color-divider);\n}\n.table td {\n  padding: var(--space-2);\n  border-bottom: 1px solid color-mix(in srgb, var(--color-text) 8%, transparent);\n}\n.table tbody tr:hover { background: color-mix(in srgb, var(--color-text) 4%, transparent); }\n\n/* — dialog — */\n.dialog-backdrop {\n  position: fixed; inset: 0; display: grid; place-items: center;\n  padding: var(--space-4);\n  background: color-mix(in srgb, var(--color-neutral-900) 50%, transparent);\n}\n.dialog {\n  width: min(440px, 100%); display: flex; flex-direction: column; gap: var(--space-3);\n  padding: var(--space-4); border-radius: var(--radius-lg);\n  background: var(--color-surface); box-shadow: var(--shadow-lg);\n}\n.dialog-title {\n  font-family: var(--font-heading); font-weight: var(--font-heading-weight);\n  font-size: 20px;\n}\n.dialog-body { font-size: 14px; opacity: 0.85; }\n.dialog-actions { display: flex; justify-content: flex-end; gap: var(--space-2); margin-top: var(--space-2); }\n\n/* — blueprint frame: components are wireframe objects (see .blueprint\n     and .corner above) — square, transparent, hairline-bordered — */\n.card, .btn, .input, .tag, .seg, .dialog { border-radius: 0; }\n.card, .dialog { background: transparent; border: 1px solid var(--color-divider); }\n.btn { border: 1px solid var(--color-divider); }\n.btn-primary { border-color: var(--color-accent); }\n.btn-ghost { border-color: transparent; }\n\n<\u002Fstyle>\n<script src=\"ad7125f0-41ed-445b-aaea-5a368d7baf39\"><\u002Fscript>\n<style>\nhtml,body{margin:0;background:var(--color-bg)}\na{color:var(--color-accent-700)}a:hover{color:var(--color-accent-800)}\n@keyframes snspin{to{transform:rotate(360deg)}}\ninput[type=checkbox]{accent-color:var(--color-accent);width:16px;height:16px}\n<\u002Fstyle>\n<\u002Fhelmet>\n\n<sc-if value=\"{{ showAuth }}\" hint-placeholder-val=\"{{ false }}\">\n<div style=\"min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px;font-family:var(--font-body);color:var(--color-text)\">\n  <div style=\"width:100%;max-width:400px;display:flex;flex-direction:column;gap:20px\">\n    <div style=\"display:flex;align-items:baseline;justify-content:space-between\">\n      <div style=\"font-family:var(--font-heading);font-weight:600;font-size:28px;letter-spacing:.06em\">SN ADS<\u002Fdiv>\n      <div style=\"font-size:12px;color:var(--color-neutral-700)\">Soro Nua Agency · internal<\u002Fdiv>\n    <\u002Fdiv>\n    <div class=\"blueprint\" style=\"padding:24px;display:flex;flex-direction:column;gap:14px\">\n      <i class=\"corner tl\"><\u002Fi><i class=\"corner tr\"><\u002Fi><i class=\"corner bl\"><\u002Fi><i class=\"corner br\"><\u002Fi>\n      <sc-if value=\"{{ isSigninView }}\" hint-placeholder-val=\"{{ true }}\">\n        <h2 style=\"margin:0\">Sign in<\u002Fh2>\n        <sc-if value=\"{{ si.err }}\"><div role=\"alert\" style=\"padding:8px 12px;border:1px solid var(--color-accent-700);background:var(--color-accent-100);color:var(--color-accent-900);font-size:13px\">{{ si.err }}<\u002Fdiv><\u002Fsc-if>\n        <div class=\"field\"><label for=\"si-email\">Email<\u002Flabel><input id=\"si-email\" class=\"input\" type=\"email\" value=\"{{ si.email }}\" sc-camel-on-change=\"{{ onSiEmail }}\"><\u002Fdiv>\n        <div class=\"field\"><label for=\"si-pw\">Password<\u002Flabel><input id=\"si-pw\" class=\"input\" type=\"password\" value=\"{{ si.pw }}\" sc-camel-on-change=\"{{ onSiPw }}\"><\u002Fdiv>\n        <button class=\"btn btn-primary blueprint\" style=\"width:100%;padding:10px\" sc-camel-on-click=\"{{ doSignin }}\"><i class=\"corner tl\"><\u002Fi><i class=\"corner tr\"><\u002Fi><i class=\"corner bl\"><\u002Fi><i class=\"corner br\"><\u002Fi>Sign in<\u002Fbutton>\n        <button class=\"btn btn-ghost\" style=\"align-self:flex-start\" sc-camel-on-click=\"{{ goForgot }}\">Forgot password?<\u002Fbutton>\n      <\u002Fsc-if>\n      <sc-if value=\"{{ isForgotView }}\" hint-placeholder-val=\"{{ false }}\">\n        <h2 style=\"margin:0\">Reset your password<\u002Fh2>\n        <sc-if value=\"{{ fpSent }}\">\n          <p style=\"margin:0;font-size:14px\">If an account exists for this email, a reset link has been sent. It opens the “Set your password” screen.<\u002Fp>\n        <\u002Fsc-if>\n        <sc-if value=\"{{ fpNotSent }}\">\n          <div class=\"field\"><label for=\"fp-email\">Email<\u002Flabel><input id=\"fp-email\" class=\"input\" type=\"email\" value=\"{{ fpEmail }}\" sc-camel-on-change=\"{{ onFpEmail }}\"><\u002Fdiv>\n          <button class=\"btn btn-primary blueprint\" style=\"width:100%;padding:10px\" sc-camel-on-click=\"{{ sendReset }}\"><i class=\"corner tl\"><\u002Fi><i class=\"corner tr\"><\u002Fi><i class=\"corner bl\"><\u002Fi><i class=\"corner br\"><\u002Fi>Send reset link<\u002Fbutton>\n        <\u002Fsc-if>\n        <button class=\"btn btn-ghost\" style=\"align-self:flex-start\" sc-camel-on-click=\"{{ goSignin }}\">Back to sign in<\u002Fbutton>\n      <\u002Fsc-if>\n    <\u002Fdiv>\n    <div style=\"font-size:12px;color:var(--color-neutral-700)\">Accounts are created by invitation from an administrator.<\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fdiv>\n<\u002Fsc-if>\n\n<sc-if value=\"{{ showApp }}\" hint-placeholder-val=\"{{ true }}\">\n<div style=\"min-height:100vh;display:flex;flex-direction:column;font-family:var(--font-body);color:var(--color-text)\">\n  <header style=\"display:flex;align-items:center;gap:20px;padding:0 24px;min-height:56px;border-bottom:1px solid var(--color-divider);flex-wrap:wrap\">\n    <div style=\"font-family:var(--font-heading);font-weight:600;font-size:22px;letter-spacing:.06em\">SN ADS<\u002Fdiv>\n    <nav style=\"display:flex;align-items:stretch;gap:2px;flex:1;flex-wrap:wrap;align-self:stretch\">\n      <sc-for list=\"{{ navMain }}\" as=\"n\" hint-placeholder-count=\"3\">\n        <button sc-camel-on-click=\"{{ n.go }}\" style=\"background:none;border:0;border-bottom:2px solid {{ n.bar }};padding:0 12px;font-family:var(--font-heading);font-weight:600;font-size:15px;color:{{ n.color }};cursor:pointer;letter-spacing:.02em\" style-hover=\"color:var(--color-accent-700)\">{{ n.label }}<\u002Fbutton>\n      <\u002Fsc-for>\n      <sc-if value=\"{{ isAdmin }}\">\n        <div style=\"width:1px;background:var(--color-divider);margin:14px 10px\"><\u002Fdiv>\n        <div style=\"align-self:center;font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--color-neutral-700);margin-right:4px\">Admin<\u002Fdiv>\n        <sc-for list=\"{{ navAdmin }}\" as=\"n\" hint-placeholder-count=\"4\">\n          <button sc-camel-on-click=\"{{ n.go }}\" style=\"background:none;border:0;border-bottom:2px solid {{ n.bar }};padding:0 12px;font-family:var(--font-heading);font-weight:600;font-size:15px;color:{{ n.color }};cursor:pointer;letter-spacing:.02em\" style-hover=\"color:var(--color-accent-700)\">{{ n.label }}<\u002Fbutton>\n        <\u002Fsc-for>\n      <\u002Fsc-if>\n    <\u002Fnav>\n    <div style=\"display:flex;align-items:center;gap:10px\">\n      <div style=\"text-align:right;line-height:1.2\"><div style=\"font-size:13px;font-weight:500\">{{ me.name }}<\u002Fdiv><div style=\"font-size:11px;color:var(--color-neutral-700)\">{{ me.roleLabel }}<\u002Fdiv><\u002Fdiv>\n      <button class=\"btn btn-secondary\" sc-camel-on-click=\"{{ signOut }}\"><svg width=\"15\" height=\"15\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.5\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4\"><\u002Fpath><polyline points=\"16 17 21 12 16 7\"><\u002Fpolyline><line x1=\"21\" y1=\"12\" x2=\"9\" y2=\"12\"><\u002Fline><\u002Fsvg>Sign out<\u002Fbutton>\n    <\u002Fdiv>\n  <\u002Fheader>\n\n  <sc-if value=\"{{ isPredict }}\" hint-placeholder-val=\"{{ true }}\">\n  <main style=\"padding:24px;width:100%;max-width:1440px;margin:0 auto;display:flex;flex-direction:column;gap:20px;box-sizing:border-box\">\n    <div style=\"display:flex;align-items:flex-end;justify-content:space-between;gap:16px;flex-wrap:wrap\">\n      <div><h1 style=\"margin:0;font-size:38px\">Predict<\u002Fh1><div style=\"font-size:14px;color:var(--color-neutral-700)\">Describe a campaign. Results update as you type.<\u002Fdiv><\u002Fdiv>\n      <div style=\"display:flex;align-items:center;gap:12px\">\n        <sc-if value=\"{{ pending }}\"><div style=\"display:flex;align-items:center;gap:6px;font-size:12px;color:var(--color-neutral-700)\"><span style=\"display:inline-flex;animation:snspin 1s linear infinite\"><svg width=\"14\" height=\"14\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.5\" stroke-linecap=\"round\"><path d=\"M21 12a9 9 0 1 1-6.2-8.56\"><\u002Fpath><\u002Fsvg><\u002Fspan>Recalculating…<\u002Fdiv><\u002Fsc-if>\n        <sc-if value=\"{{ hasModel }}\"><span class=\"tag tag-accent\">Model {{ modelTag }}<\u002Fspan><\u002Fsc-if>\n        <button class=\"btn btn-primary blueprint\" disabled=\"{{ cantSave }}\" sc-camel-on-click=\"{{ openSave }}\"><i class=\"corner tl\"><\u002Fi><i class=\"corner tr\"><\u002Fi><i class=\"corner bl\"><\u002Fi><i class=\"corner br\"><\u002Fi>Save prediction<\u002Fbutton>\n      <\u002Fdiv>\n    <\u002Fdiv>\n\n    <sc-if value=\"{{ noModel }}\">\n      <div role=\"status\" style=\"display:flex;gap:10px;align-items:flex-start;padding:12px 14px;border:1px solid var(--color-accent);background:var(--color-accent-100);color:var(--color-accent-900);font-size:14px\"><svg width=\"18\" height=\"18\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.5\" stroke-linecap=\"round\" stroke-linejoin=\"round\" style=\"flex:none;margin-top:1px\"><path d=\"m21.73 18-8-14a2 2 0 0 0-3.48 0l-8 14A2 2 0 0 0 4 21h16a2 2 0 0 0 1.73-3\"><\u002Fpath><line x1=\"12\" y1=\"9\" x2=\"12\" y2=\"13\"><\u002Fline><line x1=\"12\" y1=\"17\" x2=\"12.01\" y2=\"17\"><\u002Fline><\u002Fsvg>No active model yet. An administrator must train and activate a model.<\u002Fdiv>\n    <\u002Fsc-if>\n    <sc-if value=\"{{ viewing }}\">\n      <div style=\"display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap;padding:10px 14px;border:1px solid var(--color-divider);font-size:14px\">\n        <div>Viewing saved prediction <strong style=\"font-weight:500\">“{{ viewing.label }}”<\u002Fstrong> — calculated on {{ viewing.date }} with model {{ viewing.model }}. Edit any field to run a new simulation.<\u002Fdiv>\n        <button class=\"btn btn-ghost\" sc-camel-on-click=\"{{ goHistory }}\">Back to history<\u002Fbutton>\n      <\u002Fdiv>\n    <\u002Fsc-if>\n\n    <div style=\"display:flex;flex-wrap:wrap;gap:28px;align-items:flex-start\">\n      <section aria-label=\"Campaign form\" style=\"flex:1 1 340px;max-width:480px;display:flex;flex-direction:column;gap:22px\">\n        <sc-for list=\"{{ formGroups }}\" as=\"g\" hint-placeholder-count=\"3\">\n          <fieldset class=\"blueprint\" disabled=\"{{ noModel }}\" style=\"margin:0;padding:16px;display:flex;flex-direction:column;gap:14px;min-width:0\">\n            <i class=\"corner tl\"><\u002Fi><i class=\"corner tr\"><\u002Fi><i class=\"corner bl\"><\u002Fi><i class=\"corner br\"><\u002Fi>\n            <div style=\"display:flex;justify-content:space-between;align-items:baseline;gap:8px\">\n              <div><div style=\"font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--color-accent-700)\">{{ g.num }}<\u002Fdiv><h4 style=\"margin:0\">{{ g.title }}<\u002Fh4><\u002Fdiv>\n              <div style=\"font-size:12px;color:var(--color-neutral-700);text-align:right\">{{ g.hint }}<\u002Fdiv>\n            <\u002Fdiv>\n            <div style=\"display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:12px\">\n              <sc-for list=\"{{ g.fields }}\" as=\"f\" hint-placeholder-count=\"3\">\n                <div class=\"field\" style=\"min-width:0\">\n                  <label for=\"{{ f.id }}\">{{ f.label }}<\u002Flabel>\n                  <sc-if value=\"{{ f.isSelect }}\"><sc-raw-select id=\"{{ f.id }}\" class=\"input\" value=\"{{ f.value }}\" sc-camel-on-change=\"{{ f.onChange }}\"><sc-for list=\"{{ f.options }}\" as=\"o\"><option value=\"{{ o }}\">{{ o }}<\u002Foption><\u002Fsc-for><\u002Fsc-raw-select><\u002Fsc-if>\n                  <sc-if value=\"{{ f.isInput }}\"><input id=\"{{ f.id }}\" class=\"input\" sc-camel-input-mode=\"decimal\" value=\"{{ f.value }}\" sc-camel-on-change=\"{{ f.onChange }}\" aria-invalid=\"{{ f.hasErr }}\" aria-describedby=\"{{ f.descId }}\" style=\"border-color:{{ f.border }}\"><\u002Fsc-if>\n                  <sc-if value=\"{{ f.hasErr }}\"><div id=\"{{ f.descId }}\" style=\"display:flex;gap:4px;align-items:flex-start;margin-top:4px;font-size:12px;font-weight:500;color:var(--color-accent-800)\"><svg width=\"13\" height=\"13\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.5\" style=\"flex:none;margin-top:2px\"><circle cx=\"12\" cy=\"12\" r=\"10\"><\u002Fcircle><line x1=\"12\" y1=\"8\" x2=\"12\" y2=\"12\"><\u002Fline><line x1=\"12\" y1=\"16\" x2=\"12.01\" y2=\"16\"><\u002Fline><\u002Fsvg>{{ f.err }}<\u002Fdiv><\u002Fsc-if>\n                  <sc-if value=\"{{ f.warn }}\"><div id=\"{{ f.descId }}\" style=\"display:flex;gap:4px;align-items:flex-start;margin-top:4px;font-size:12px;font-style:italic;color:var(--color-neutral-700)\"><svg width=\"13\" height=\"13\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.5\" style=\"flex:none;margin-top:2px\"><path d=\"m21.73 18-8-14a2 2 0 0 0-3.48 0l-8 14A2 2 0 0 0 4 21h16a2 2 0 0 0 1.73-3\"><\u002Fpath><line x1=\"12\" y1=\"9\" x2=\"12\" y2=\"13\"><\u002Fline><\u002Fsvg>Outside the values the model has seen. Treat this prediction with caution.<\u002Fdiv><\u002Fsc-if>\n                <\u002Fdiv>\n              <\u002Fsc-for>\n            <\u002Fdiv>\n            <sc-if value=\"{{ g.isEng }}\">\n              <div style=\"display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap;padding-top:10px;border-top:1px solid var(--color-divider);font-size:12px;color:var(--color-neutral-700)\">\n                <span>Prefilled with the observed average for {{ engBasis }}.<\u002Fspan>\n                <button type=\"button\" class=\"btn btn-ghost\" style=\"font-size:13px\" sc-camel-on-click=\"{{ resetEng }}\">Reset to averages<\u002Fbutton>\n              <\u002Fdiv>\n            <\u002Fsc-if>\n          <\u002Ffieldset>\n        <\u002Fsc-for>\n      <\u002Fsection>\n\n      <section aria-label=\"Results\" style=\"flex:2 1 520px;min-width:0;display:flex;flex-direction:column;gap:22px\">\n        <sc-if value=\"{{ noResult }}\">\n          <div class=\"blueprint\" style=\"padding:48px 24px;text-align:center;color:var(--color-neutral-700);font-size:14px\"><i class=\"corner tl\"><\u002Fi><i class=\"corner tr\"><\u002Fi><i class=\"corner bl\"><\u002Fi><i class=\"corner br\"><\u002Fi>{{ noResultMsg }}<\u002Fdiv>\n        <\u002Fsc-if>\n        <sc-if value=\"{{ hasResult }}\" hint-placeholder-val=\"{{ true }}\">\n          <div role=\"note\" style=\"display:flex;gap:10px;align-items:flex-start;padding:10px 14px;border:1px solid var(--color-accent);background:var(--color-accent-100);color:var(--color-accent-900);font-size:13px\"><svg width=\"16\" height=\"16\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.5\" stroke-linecap=\"round\" style=\"flex:none;margin-top:2px\"><circle cx=\"12\" cy=\"12\" r=\"10\"><\u002Fcircle><line x1=\"12\" y1=\"16\" x2=\"12\" y2=\"12\"><\u002Fline><line x1=\"12\" y1=\"8\" x2=\"12.01\" y2=\"8\"><\u002Fline><\u002Fsvg><span>The current model has low accuracy. Its predictions stay close to average values. <a href=\"#\" sc-camel-on-click=\"{{ goModel }}\">See model reliability<\u002Fa><\u002Fspan><\u002Fdiv>\n\n          <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:18px\">\n            <sc-for list=\"{{ r.metrics }}\" as=\"m\" hint-placeholder-count=\"3\">\n              <div class=\"blueprint\" style=\"padding:16px;display:flex;flex-direction:column;gap:4px\">\n                <i class=\"corner tl\"><\u002Fi><i class=\"corner tr\"><\u002Fi><i class=\"corner bl\"><\u002Fi><i class=\"corner br\"><\u002Fi>\n                <div style=\"font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--color-accent-700)\">{{ m.label }}<\u002Fdiv>\n                <div style=\"font-family:var(--font-heading);font-weight:400;font-size:44px;line-height:1;font-variant-numeric:tabular-nums;letter-spacing:-.01em\">{{ m.value }}<\u002Fdiv>\n                <div style=\"font-size:12px;color:var(--color-neutral-700)\">{{ m.avg }}<\u002Fdiv>\n              <\u002Fdiv>\n            <\u002Fsc-for>\n          <\u002Fdiv>\n\n          <div class=\"blueprint\" style=\"padding:18px;display:flex;flex-direction:column;gap:16px\">\n            <i class=\"corner tl\"><\u002Fi><i class=\"corner tr\"><\u002Fi><i class=\"corner bl\"><\u002Fi><i class=\"corner br\"><\u002Fi>\n            <div style=\"display:flex;gap:28px;flex-wrap:wrap;align-items:flex-end\">\n              <div style=\"flex:0 0 auto\">\n                <div style=\"font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--color-accent-700)\">Performance level<\u002Fdiv>\n                <div style=\"font-family:var(--font-heading);font-weight:400;font-size:56px;line-height:1;color:{{ r.levelColor }}\">{{ r.level }}<\u002Fdiv>\n                <div style=\"font-size:13px;color:var(--color-neutral-700);font-variant-numeric:tabular-nums\">Score {{ r.score }} / 100<\u002Fdiv>\n              <\u002Fdiv>\n              <div style=\"flex:1 1 280px;display:flex;flex-direction:column;gap:6px\">\n                <div style=\"position:relative;height:28px;display:grid;grid-template-columns:{{ r.scaleCols }};border:1px solid var(--color-divider)\">\n                  <div style=\"display:flex;align-items:center;justify-content:center;font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--color-neutral-700)\">Low<\u002Fdiv>\n                  <div style=\"display:flex;align-items:center;justify-content:center;font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--color-neutral-700);border-left:1px solid var(--color-divider);border-right:1px solid var(--color-divider);background:var(--color-accent-100)\">Medium<\u002Fdiv>\n                  <div style=\"display:flex;align-items:center;justify-content:center;font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--color-neutral-700)\">High<\u002Fdiv>\n                  <div style=\"position:absolute;top:-6px;bottom:-6px;left:{{ r.scorePct }};width:2px;margin-left:-1px;background:var(--color-accent-800);transition:left .3s\"><\u002Fdiv>\n                <\u002Fdiv>\n                <div style=\"display:flex;justify-content:space-between;font-size:11px;color:var(--color-neutral-700);font-variant-numeric:tabular-nums\"><span>0<\u002Fspan><span>Low below {{ r.lowBelow }} · High from {{ r.highFrom }}<\u002Fspan><span>100<\u002Fspan><\u002Fdiv>\n              <\u002Fdiv>\n            <\u002Fdiv>\n            <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:16px;padding-top:14px;border-top:1px solid var(--color-divider)\">\n              <sc-for list=\"{{ r.notes }}\" as=\"n\" hint-placeholder-count=\"3\">\n                <div style=\"display:flex;flex-direction:column;gap:6px\">\n                  <div style=\"display:flex;justify-content:space-between;gap:8px;font-size:12px;color:var(--color-neutral-700)\"><span>{{ n.label }}<\u002Fspan><span style=\"font-variant-numeric:tabular-nums\">note {{ n.note }}<\u002Fspan><\u002Fdiv>\n                  <div style=\"font-family:var(--font-heading);font-weight:600;font-size:22px;font-variant-numeric:tabular-nums\">{{ n.value }}<\u002Fdiv>\n                  <div style=\"height:4px;background:var(--color-neutral-200)\"><div style=\"height:100%;width:{{ n.w }};background:var(--color-accent);transition:width .3s\"><\u002Fdiv><\u002Fdiv>\n                <\u002Fdiv>\n              <\u002Fsc-for>\n            <\u002Fdiv>\n            <div style=\"font-size:12px;color:var(--color-neutral-700)\">{{ r.refText }}<\u002Fdiv>\n          <\u002Fdiv>\n\n          <div class=\"blueprint\" style=\"padding:18px;display:flex;flex-direction:column;gap:14px\">\n            <i class=\"corner tl\"><\u002Fi><i class=\"corner tr\"><\u002Fi><i class=\"corner bl\"><\u002Fi><i class=\"corner br\"><\u002Fi>\n            <div style=\"display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap\">\n              <div><h4 style=\"margin:0\">What moved this prediction<\u002Fh4><div style=\"font-size:12px;color:var(--color-neutral-700)\">Top 5 inputs pushing each figure up or down, for this campaign.<\u002Fdiv><\u002Fdiv>\n              <div class=\"seg\" role=\"tablist\">\n                <sc-for list=\"{{ driverTabs }}\" as=\"t\" hint-placeholder-count=\"3\"><button role=\"tab\" aria-selected=\"{{ t.on }}\" sc-camel-on-click=\"{{ t.go }}\" style=\"border:0;border-left:{{ t.sep }};padding:7px 12px;font:inherit;font-size:13px;cursor:pointer;background:{{ t.bg }};color:{{ t.fg }}\">{{ t.label }}<\u002Fbutton><\u002Fsc-for>\n              <\u002Fdiv>\n            <\u002Fdiv>\n            <div style=\"display:flex;flex-direction:column\">\n              <sc-for list=\"{{ r.drivers }}\" as=\"d\" hint-placeholder-count=\"5\">\n                <div style=\"display:grid;grid-template-columns:minmax(120px,1.2fr) minmax(0,2fr) 84px;gap:12px;align-items:center;padding:8px 0;border-bottom:1px solid color-mix(in srgb,var(--color-text) 8%,transparent)\">\n                  <div style=\"min-width:0\"><div style=\"font-size:14px\">{{ d.label }}<\u002Fdiv><div style=\"font-size:12px;color:var(--color-neutral-700)\">{{ d.value }}<\u002Fdiv><\u002Fdiv>\n                  <div style=\"display:grid;grid-template-columns:1fr 1fr;height:12px\">\n                    <div style=\"display:flex;justify-content:flex-end;border-right:1px solid var(--color-text)\"><div style=\"height:100%;width:{{ d.leftW }};background:var(--color-neutral-500)\"><\u002Fdiv><\u002Fdiv>\n                    <div style=\"display:flex\"><div style=\"height:100%;width:{{ d.rightW }};background:var(--color-accent)\"><\u002Fdiv><\u002Fdiv>\n                  <\u002Fdiv>\n                  <div style=\"display:flex;align-items:center;justify-content:flex-end;gap:4px;font-size:13px;font-variant-numeric:tabular-nums\">\n                    <sc-if value=\"{{ d.up }}\"><svg width=\"13\" height=\"13\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"var(--color-accent-700)\" stroke-width=\"1.5\" stroke-linecap=\"round\"><line x1=\"12\" y1=\"19\" x2=\"12\" y2=\"5\"><\u002Fline><polyline points=\"5 12 12 5 19 12\"><\u002Fpolyline><\u002Fsvg><\u002Fsc-if>\n                    <sc-if value=\"{{ d.down }}\"><svg width=\"13\" height=\"13\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"var(--color-neutral-700)\" stroke-width=\"1.5\" stroke-linecap=\"round\"><line x1=\"12\" y1=\"5\" x2=\"12\" y2=\"19\"><\u002Fline><polyline points=\"19 12 12 19 5 12\"><\u002Fpolyline><\u002Fsvg><\u002Fsc-if>\n                    {{ d.contrib }}\n                  <\u002Fdiv>\n                <\u002Fdiv>\n              <\u002Fsc-for>\n            <\u002Fdiv>\n          <\u002Fdiv>\n\n          <div class=\"blueprint\" style=\"padding:18px;display:flex;flex-direction:column;gap:14px\">\n            <i class=\"corner tl\"><\u002Fi><i class=\"corner tr\"><\u002Fi><i class=\"corner bl\"><\u002Fi><i class=\"corner br\"><\u002Fi>\n            <div><h4 style=\"margin:0\">Recommended changes<\u002Fh4><div style=\"font-size:12px;color:var(--color-neutral-700)\">One lever at a time. Only changes that add at least 5 points to the score are shown.<\u002Fdiv><\u002Fdiv>\n            <sc-if value=\"{{ r.recsNone }}\">\n              <div style=\"padding:14px;border:1px dashed var(--color-divider);font-size:14px\">No tested change improves the result significantly.<div style=\"font-size:12px;color:var(--color-neutral-700);margin-top:4px\">Tested: every other channel and type, ad spend from −50% to +50% in 10% steps, other age, income, gender, purchase and loyalty levels.<\u002Fdiv><\u002Fdiv>\n            <\u002Fsc-if>\n            <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:16px\">\n              <sc-for list=\"{{ r.recs }}\" as=\"c\" hint-placeholder-count=\"2\">\n                <div style=\"border:1px solid var(--color-divider);padding:14px;display:flex;flex-direction:column;gap:10px\">\n                  <div style=\"display:flex;justify-content:space-between;align-items:baseline;gap:8px\"><div style=\"font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--color-accent-700)\">{{ c.lever }}<\u002Fdiv><span class=\"tag tag-accent\" style=\"font-variant-numeric:tabular-nums\">{{ c.gain }} pts<\u002Fspan><\u002Fdiv>\n                  <div style=\"font-family:var(--font-heading);font-weight:600;font-size:19px;line-height:1.2\">{{ c.from }} → {{ c.to }}<\u002Fdiv>\n                  <sc-raw-table class=\"table\" style=\"font-size:12px\">\n                    <sc-raw-thead><sc-raw-tr><sc-raw-th style=\"padding:4px 0\"><\u002Fsc-raw-th><sc-raw-th style=\"padding:4px 0;text-align:right\">Now<\u002Fsc-raw-th><sc-raw-th style=\"padding:4px 0;text-align:right\">After<\u002Fsc-raw-th><\u002Fsc-raw-tr><\u002Fsc-raw-thead>\n                    <sc-raw-tbody><sc-for list=\"{{ c.rows }}\" as=\"w\"><sc-raw-tr><sc-raw-td style=\"padding:4px 0\">{{ w.m }}<\u002Fsc-raw-td><sc-raw-td style=\"padding:4px 0;text-align:right;font-variant-numeric:tabular-nums;color:var(--color-neutral-700)\">{{ w.a }}<\u002Fsc-raw-td><sc-raw-td style=\"padding:4px 0;text-align:right;font-variant-numeric:tabular-nums;font-weight:500\">{{ w.b }}<\u002Fsc-raw-td><\u002Fsc-raw-tr><\u002Fsc-for><\u002Fsc-raw-tbody>\n                  <\u002Fsc-raw-table>\n                  <button class=\"btn btn-secondary\" sc-camel-on-click=\"{{ c.apply }}\">Apply<\u002Fbutton>\n                <\u002Fdiv>\n              <\u002Fsc-for>\n            <\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fsc-if>\n      <\u002Fsection>\n    <\u002Fdiv>\n  <\u002Fmain>\n  <\u002Fsc-if>\n\n  <sc-if value=\"{{ isHistory }}\">\n  <main style=\"padding:24px;width:100%;max-width:1200px;margin:0 auto;display:flex;flex-direction:column;gap:20px;box-sizing:border-box\">\n    <div><h1 style=\"margin:0;font-size:38px\">History<\u002Fh1><div style=\"font-size:14px;color:var(--color-neutral-700)\">Your saved predictions. Only you can see them.<\u002Fdiv><\u002Fdiv>\n    <sc-if value=\"{{ historyEmpty }}\"><div class=\"blueprint\" style=\"padding:40px;text-align:center;color:var(--color-neutral-700)\"><i class=\"corner tl\"><\u002Fi><i class=\"corner tr\"><\u002Fi><i class=\"corner bl\"><\u002Fi><i class=\"corner br\"><\u002Fi>No saved predictions yet. Use “Save prediction” on the Predict page.<\u002Fdiv><\u002Fsc-if>\n    <sc-if value=\"{{ historyAny }}\">\n    <div style=\"overflow-x:auto\">\n    <sc-raw-table class=\"table\">\n      <sc-raw-thead><sc-raw-tr><sc-raw-th>Name<\u002Fsc-raw-th><sc-raw-th>Date<\u002Fsc-raw-th><sc-raw-th>Channel<\u002Fsc-raw-th><sc-raw-th>Campaign type<\u002Fsc-raw-th><sc-raw-th>Level<\u002Fsc-raw-th><sc-raw-th style=\"text-align:right\">Score<\u002Fsc-raw-th><sc-raw-th>Model<\u002Fsc-raw-th><sc-raw-th><\u002Fsc-raw-th><\u002Fsc-raw-tr><\u002Fsc-raw-thead>\n      <sc-raw-tbody>\n        <sc-for list=\"{{ historyRows }}\" as=\"h\" hint-placeholder-count=\"3\">\n          <sc-raw-tr>\n            <sc-raw-td><button class=\"btn btn-ghost\" style=\"font-family:var(--font-body);font-weight:500;font-size:14px;padding:2px 0\" sc-camel-on-click=\"{{ h.open }}\">{{ h.label }}<\u002Fbutton><\u002Fsc-raw-td>\n            <sc-raw-td style=\"white-space:nowrap;font-variant-numeric:tabular-nums\">{{ h.date }}<\u002Fsc-raw-td><sc-raw-td>{{ h.channel }}<\u002Fsc-raw-td><sc-raw-td>{{ h.type }}<\u002Fsc-raw-td>\n            <sc-raw-td><span class=\"tag {{ h.levelClass }}\">{{ h.level }}<\u002Fspan><\u002Fsc-raw-td>\n            <sc-raw-td style=\"text-align:right;font-variant-numeric:tabular-nums\">{{ h.score }}<\u002Fsc-raw-td><sc-raw-td>{{ h.model }}<\u002Fsc-raw-td>\n            <sc-raw-td style=\"text-align:right;white-space:nowrap\">\n              <sc-if value=\"{{ h.confirming }}\"><span style=\"font-size:12px;margin-right:6px\">Delete?<\u002Fspan><button class=\"btn btn-secondary\" style=\"padding:3px 10px\" sc-camel-on-click=\"{{ h.del }}\">Delete<\u002Fbutton><button class=\"btn btn-ghost\" sc-camel-on-click=\"{{ h.cancel }}\">Cancel<\u002Fbutton><\u002Fsc-if>\n              <sc-if value=\"{{ h.notConfirming }}\"><button class=\"btn btn-ghost btn-icon\" aria-label=\"Delete prediction\" sc-camel-on-click=\"{{ h.ask }}\"><svg width=\"15\" height=\"15\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.5\" stroke-linecap=\"round\"><path d=\"M3 6h18\"><\u002Fpath><path d=\"M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6\"><\u002Fpath><path d=\"M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2\"><\u002Fpath><\u002Fsvg><\u002Fbutton><\u002Fsc-if>\n            <\u002Fsc-raw-td>\n          <\u002Fsc-raw-tr>\n        <\u002Fsc-for>\n      <\u002Fsc-raw-tbody>\n    <\u002Fsc-raw-table>\n    <\u002Fdiv>\n    <\u002Fsc-if>\n  <\u002Fmain>\n  <\u002Fsc-if>\n\n  <sc-if value=\"{{ isModel }}\">\n  <main style=\"padding:24px;width:100%;max-width:1200px;margin:0 auto;display:flex;flex-direction:column;gap:22px;box-sizing:border-box\">\n    <div><h1 style=\"margin:0;font-size:38px\">Model<\u002Fh1><div style=\"font-size:14px;color:var(--color-neutral-700)\">How reliable the active model is, and what it relies on.<\u002Fdiv><\u002Fdiv>\n    <sc-if value=\"{{ noModel }}\"><div style=\"padding:12px 14px;border:1px solid var(--color-accent);background:var(--color-accent-100);color:var(--color-accent-900);font-size:14px\">No active model yet. An administrator must train and activate a model.<\u002Fdiv><\u002Fsc-if>\n    <sc-if value=\"{{ hasModel }}\">\n      <div style=\"padding:12px 14px;border:1px solid var(--color-accent);background:var(--color-accent-100);color:var(--color-accent-900);font-size:14px\">The current model has low accuracy. Its predictions stay close to average values. They will become more meaningful once the agency adds its own data.<\u002Fdiv>\n      <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));border-top:1px solid var(--color-divider);border-left:1px solid var(--color-divider)\">\n        <sc-for list=\"{{ am.facts }}\" as=\"x\" hint-placeholder-count=\"5\">\n          <div style=\"padding:14px;border-right:1px solid var(--color-divider);border-bottom:1px solid var(--color-divider)\"><div style=\"font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--color-accent-700)\">{{ x.k }}<\u002Fdiv><div style=\"font-family:var(--font-heading);font-weight:600;font-size:22px;font-variant-numeric:tabular-nums\">{{ x.v }}<\u002Fdiv><\u002Fdiv>\n        <\u002Fsc-for>\n      <\u002Fdiv>\n      <div class=\"blueprint\" style=\"padding:18px;display:flex;flex-direction:column;gap:10px\">\n        <i class=\"corner tl\"><\u002Fi><i class=\"corner tr\"><\u002Fi><i class=\"corner bl\"><\u002Fi><i class=\"corner br\"><\u002Fi>\n        <h4 style=\"margin:0\">Reliability on held-out test rows<\u002Fh4>\n        <div style=\"overflow-x:auto\"><sc-raw-table class=\"table\">\n          <sc-raw-thead><sc-raw-tr><sc-raw-th>Figure<\u002Fsc-raw-th><sc-raw-th>Reliability<\u002Fsc-raw-th><sc-raw-th style=\"text-align:right\">R²<\u002Fsc-raw-th><sc-raw-th style=\"text-align:right\">Mean error<\u002Fsc-raw-th><sc-raw-th style=\"text-align:right\">Error if always guessing the average<\u002Fsc-raw-th><\u002Fsc-raw-tr><\u002Fsc-raw-thead>\n          <sc-raw-tbody><sc-for list=\"{{ am.rel }}\" as=\"x\" hint-placeholder-count=\"3\"><sc-raw-tr><sc-raw-td>{{ x.m }}<\u002Fsc-raw-td><sc-raw-td><span class=\"tag tag-neutral\">{{ x.rel }}<\u002Fspan><\u002Fsc-raw-td><sc-raw-td style=\"text-align:right;font-variant-numeric:tabular-nums\">{{ x.r2 }}<\u002Fsc-raw-td><sc-raw-td style=\"text-align:right;font-variant-numeric:tabular-nums\">{{ x.mae }}<\u002Fsc-raw-td><sc-raw-td style=\"text-align:right;font-variant-numeric:tabular-nums\">{{ x.base }}<\u002Fsc-raw-td><\u002Fsc-raw-tr><\u002Fsc-for><\u002Fsc-raw-tbody>\n        <\u002Fsc-raw-table><\u002Fdiv>\n        <div style=\"font-size:12px;color:var(--color-neutral-700)\">Low: R² below 0.10 · Moderate: 0.10 to 0.40 · Good: 0.40 and above.<\u002Fdiv>\n      <\u002Fdiv>\n      <div class=\"blueprint\" style=\"padding:18px;display:flex;flex-direction:column;gap:14px\">\n        <i class=\"corner tl\"><\u002Fi><i class=\"corner tr\"><\u002Fi><i class=\"corner bl\"><\u002Fi><i class=\"corner br\"><\u002Fi>\n        <div style=\"display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap\">\n          <div><h4 style=\"margin:0\">What matters most, all campaigns<\u002Fh4><div style=\"font-size:12px;color:var(--color-neutral-700)\">Share of the model's decisions attributed to each input.<\u002Fdiv><\u002Fdiv>\n          <div class=\"seg\"><sc-for list=\"{{ impTabs }}\" as=\"t\" hint-placeholder-count=\"3\"><button sc-camel-on-click=\"{{ t.go }}\" style=\"border:0;border-left:{{ t.sep }};padding:7px 12px;font:inherit;font-size:13px;cursor:pointer;background:{{ t.bg }};color:{{ t.fg }}\">{{ t.label }}<\u002Fbutton><\u002Fsc-for><\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"display:flex;flex-direction:column;gap:8px\">\n          <sc-for list=\"{{ am.imp }}\" as=\"x\" hint-placeholder-count=\"8\">\n            <div style=\"display:grid;grid-template-columns:minmax(130px,200px) minmax(0,1fr) 48px;gap:12px;align-items:center;font-size:14px\">\n              <div>{{ x.label }}<\u002Fdiv><div style=\"height:12px;background:var(--color-neutral-200)\"><div style=\"height:100%;width:{{ x.w }};background:var(--color-accent)\"><\u002Fdiv><\u002Fdiv><div style=\"text-align:right;font-variant-numeric:tabular-nums\">{{ x.share }}<\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fsc-for>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fsc-if>\n  <\u002Fmain>\n  <\u002Fsc-if>\n\n  <sc-if value=\"{{ isData }}\">\n  <main style=\"padding:24px;width:100%;max-width:1200px;margin:0 auto;display:flex;flex-direction:column;gap:22px;box-sizing:border-box\">\n    <div style=\"display:flex;justify-content:space-between;align-items:flex-end;gap:16px;flex-wrap:wrap\">\n      <div><h1 style=\"margin:0;font-size:38px\">Data<\u002Fh1><div style=\"font-size:14px;color:var(--color-neutral-700)\">The rows the model learns from, and every import.<\u002Fdiv><\u002Fdiv>\n      <button class=\"btn btn-primary blueprint\" sc-camel-on-click=\"{{ openUpload }}\"><i class=\"corner tl\"><\u002Fi><i class=\"corner tr\"><\u002Fi><i class=\"corner bl\"><\u002Fi><i class=\"corner br\"><\u002Fi><svg width=\"15\" height=\"15\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.5\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4\"><\u002Fpath><polyline points=\"17 8 12 3 7 8\"><\u002Fpolyline><line x1=\"12\" y1=\"3\" x2=\"12\" y2=\"15\"><\u002Fline><\u002Fsvg>Upload CSV<\u002Fbutton>\n    <\u002Fdiv>\n    <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));border-top:1px solid var(--color-divider);border-left:1px solid var(--color-divider)\">\n      <sc-for list=\"{{ dataFacts }}\" as=\"x\" hint-placeholder-count=\"3\">\n        <div style=\"padding:16px;border-right:1px solid var(--color-divider);border-bottom:1px solid var(--color-divider)\"><div style=\"font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--color-accent-700)\">{{ x.k }}<\u002Fdiv><div style=\"font-family:var(--font-heading);font-weight:400;font-size:40px;line-height:1.1;font-variant-numeric:tabular-nums\">{{ x.v }}<\u002Fdiv><div style=\"font-size:12px;color:var(--color-neutral-700)\">{{ x.s }}<\u002Fdiv><\u002Fdiv>\n      <\u002Fsc-for>\n    <\u002Fdiv>\n    <div style=\"overflow-x:auto\"><sc-raw-table class=\"table\">\n      <sc-raw-thead><sc-raw-tr><sc-raw-th>Date<\u002Fsc-raw-th><sc-raw-th>File<\u002Fsc-raw-th><sc-raw-th>Origin<\u002Fsc-raw-th><sc-raw-th style=\"text-align:right\">Rows<\u002Fsc-raw-th><sc-raw-th>Uploaded by<\u002Fsc-raw-th><sc-raw-th>Status<\u002Fsc-raw-th><\u002Fsc-raw-tr><\u002Fsc-raw-thead>\n      <sc-raw-tbody><sc-for list=\"{{ uploadRows }}\" as=\"u\" hint-placeholder-count=\"2\"><sc-raw-tr><sc-raw-td style=\"white-space:nowrap;font-variant-numeric:tabular-nums\">{{ u.date }}<\u002Fsc-raw-td><sc-raw-td>{{ u.file }}<\u002Fsc-raw-td><sc-raw-td>{{ u.source }}<\u002Fsc-raw-td><sc-raw-td style=\"text-align:right;font-variant-numeric:tabular-nums\">{{ u.rows }}<\u002Fsc-raw-td><sc-raw-td>{{ u.by }}<\u002Fsc-raw-td><sc-raw-td><span class=\"tag tag-accent\">{{ u.status }}<\u002Fspan><\u002Fsc-raw-td><\u002Fsc-raw-tr><\u002Fsc-for><\u002Fsc-raw-tbody>\n    <\u002Fsc-raw-table><\u002Fdiv>\n  <\u002Fmain>\n  <\u002Fsc-if>\n\n  <sc-if value=\"{{ isModels }}\">\n  <main style=\"padding:24px;width:100%;max-width:1200px;margin:0 auto;display:flex;flex-direction:column;gap:22px;box-sizing:border-box\">\n    <div style=\"display:flex;justify-content:space-between;align-items:flex-end;gap:16px;flex-wrap:wrap\">\n      <div><h1 style=\"margin:0;font-size:38px\">Models<\u002Fh1><div style=\"font-size:14px;color:var(--color-neutral-700)\">Train new versions, compare them with the active one, activate.<\u002Fdiv><\u002Fdiv>\n      <button class=\"btn btn-primary blueprint\" sc-camel-on-click=\"{{ openTrain }}\"><i class=\"corner tl\"><\u002Fi><i class=\"corner tr\"><\u002Fi><i class=\"corner bl\"><\u002Fi><i class=\"corner br\"><\u002Fi>Train a new version<\u002Fbutton>\n    <\u002Fdiv>\n    <div style=\"display:flex;flex-wrap:wrap;gap:24px;align-items:flex-start\">\n      <div style=\"flex:1 1 440px;min-width:0;overflow-x:auto\"><sc-raw-table class=\"table\">\n        <sc-raw-thead><sc-raw-tr><sc-raw-th>Version<\u002Fsc-raw-th><sc-raw-th>Status<\u002Fsc-raw-th><sc-raw-th>Data scope<\u002Fsc-raw-th><sc-raw-th>Requested by<\u002Fsc-raw-th><sc-raw-th>Created<\u002Fsc-raw-th><sc-raw-th><\u002Fsc-raw-th><\u002Fsc-raw-tr><\u002Fsc-raw-thead>\n        <sc-raw-tbody><sc-for list=\"{{ versionRows }}\" as=\"v\" hint-placeholder-count=\"3\"><sc-raw-tr sc-camel-on-click=\"{{ v.select }}\" style=\"cursor:pointer;background:{{ v.bg }}\">\n          <sc-raw-td style=\"font-family:var(--font-heading);font-weight:600;font-size:16px\">{{ v.name }}<\u002Fsc-raw-td>\n          <sc-raw-td><span class=\"tag {{ v.statusClass }}\">{{ v.status }}<\u002Fspan><sc-if value=\"{{ v.active }}\"><span class=\"tag tag-outline\" style=\"margin-left:6px\">Active<\u002Fspan><\u002Fsc-if><\u002Fsc-raw-td>\n          <sc-raw-td>{{ v.scope }}<\u002Fsc-raw-td><sc-raw-td>{{ v.by }}<\u002Fsc-raw-td><sc-raw-td style=\"white-space:nowrap;font-variant-numeric:tabular-nums\">{{ v.date }}<\u002Fsc-raw-td>\n          <sc-raw-td style=\"text-align:right\"><span style=\"font-size:13px;color:var(--color-accent-700)\">Review<\u002Fspan><\u002Fsc-raw-td>\n        <\u002Fsc-raw-tr><\u002Fsc-for><\u002Fsc-raw-tbody>\n      <\u002Fsc-raw-table><\u002Fdiv>\n      <sc-if value=\"{{ hasSel }}\">\n      <div class=\"blueprint\" style=\"flex:1 1 360px;min-width:0;padding:18px;display:flex;flex-direction:column;gap:14px\">\n        <i class=\"corner tl\"><\u002Fi><i class=\"corner tr\"><\u002Fi><i class=\"corner bl\"><\u002Fi><i class=\"corner br\"><\u002Fi>\n        <div style=\"display:flex;justify-content:space-between;align-items:baseline;gap:8px\"><h3 style=\"margin:0\">Version {{ sel.name }}<\u002Fh3><span class=\"tag {{ sel.statusClass }}\">{{ sel.status }}<\u002Fspan><\u002Fdiv>\n        <div style=\"font-size:13px;color:var(--color-neutral-700)\">{{ sel.meta }}<\u002Fdiv>\n        <sc-if value=\"{{ sel.inProgress }}\">\n          <div style=\"display:flex;align-items:center;gap:10px;padding:14px;border:1px dashed var(--color-divider);font-size:14px\"><span style=\"display:inline-flex;animation:snspin 1s linear infinite\"><svg width=\"16\" height=\"16\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.5\" stroke-linecap=\"round\"><path d=\"M21 12a9 9 0 1 1-6.2-8.56\"><\u002Fpath><\u002Fsvg><\u002Fspan>{{ sel.progress }}<\u002Fdiv>\n        <\u002Fsc-if>\n        <sc-if value=\"{{ sel.failed }}\"><div style=\"padding:12px;border:1px solid var(--color-accent-700);background:var(--color-accent-100);color:var(--color-accent-900);font-size:14px\">{{ sel.error }}<\u002Fdiv><\u002Fsc-if>\n        <sc-if value=\"{{ sel.hasCmp }}\">\n          <sc-raw-table class=\"table\" style=\"font-size:13px\">\n            <sc-raw-thead><sc-raw-tr><sc-raw-th>Mean error<\u002Fsc-raw-th><sc-raw-th style=\"text-align:right\">{{ sel.prevName }}<\u002Fsc-raw-th><sc-raw-th style=\"text-align:right\">{{ sel.name }}<\u002Fsc-raw-th><sc-raw-th style=\"text-align:right\">Change<\u002Fsc-raw-th><\u002Fsc-raw-tr><\u002Fsc-raw-thead>\n            <sc-raw-tbody><sc-for list=\"{{ sel.cmp }}\" as=\"x\"><sc-raw-tr><sc-raw-td>{{ x.m }}<\u002Fsc-raw-td><sc-raw-td style=\"text-align:right;font-variant-numeric:tabular-nums\">{{ x.prev }}<\u002Fsc-raw-td><sc-raw-td style=\"text-align:right;font-variant-numeric:tabular-nums\">{{ x.next }}<\u002Fsc-raw-td><sc-raw-td style=\"text-align:right;font-variant-numeric:tabular-nums\">{{ x.chg }}<\u002Fsc-raw-td><\u002Fsc-raw-tr><\u002Fsc-for><\u002Fsc-raw-tbody>\n          <\u002Fsc-raw-table>\n          <div style=\"display:flex;gap:8px;align-items:center;font-size:14px;font-weight:500;color:{{ sel.verdictColor }}\">{{ sel.verdict }}<\u002Fdiv>\n        <\u002Fsc-if>\n        <sc-if value=\"{{ sel.noCmp }}\"><div style=\"font-size:13px;color:var(--color-neutral-700)\">No active version to compare against.<\u002Fdiv><\u002Fsc-if>\n        <sc-if value=\"{{ sel.canShowActivate }}\">\n          <button class=\"btn btn-primary blueprint\" style=\"align-self:flex-start\" disabled=\"{{ sel.cantActivate }}\" sc-camel-on-click=\"{{ sel.activate }}\"><i class=\"corner tl\"><\u002Fi><i class=\"corner tr\"><\u002Fi><i class=\"corner bl\"><\u002Fi><i class=\"corner br\"><\u002Fi>Activate this version<\u002Fbutton>\n        <\u002Fsc-if>\n        <sc-if value=\"{{ sel.active }}\"><div style=\"font-size:13px;color:var(--color-accent-700)\">This is the active version. Every new prediction uses it.<\u002Fdiv><\u002Fsc-if>\n      <\u002Fdiv>\n      <\u002Fsc-if>\n    <\u002Fdiv>\n  <\u002Fmain>\n  <\u002Fsc-if>\n\n  <sc-if value=\"{{ isUsers }}\">\n  <main style=\"padding:24px;width:100%;max-width:1200px;margin:0 auto;display:flex;flex-direction:column;gap:22px;box-sizing:border-box\">\n    <div style=\"display:flex;justify-content:space-between;align-items:flex-end;gap:16px;flex-wrap:wrap\">\n      <div><h1 style=\"margin:0;font-size:38px\">Users<\u002Fh1><div style=\"font-size:14px;color:var(--color-neutral-700)\">Accounts are created by invitation only.<\u002Fdiv><\u002Fdiv>\n      <button class=\"btn btn-primary blueprint\" sc-camel-on-click=\"{{ openInvite }}\"><i class=\"corner tl\"><\u002Fi><i class=\"corner tr\"><\u002Fi><i class=\"corner bl\"><\u002Fi><i class=\"corner br\"><\u002Fi>Invite user<\u002Fbutton>\n    <\u002Fdiv>\n    <div style=\"overflow-x:auto\"><sc-raw-table class=\"table\">\n      <sc-raw-thead><sc-raw-tr><sc-raw-th>Name<\u002Fsc-raw-th><sc-raw-th>Email<\u002Fsc-raw-th><sc-raw-th>Role<\u002Fsc-raw-th><sc-raw-th>Status<\u002Fsc-raw-th><sc-raw-th><\u002Fsc-raw-th><\u002Fsc-raw-tr><\u002Fsc-raw-thead>\n      <sc-raw-tbody><sc-for list=\"{{ userRows }}\" as=\"u\" hint-placeholder-count=\"4\"><sc-raw-tr>\n        <sc-raw-td>{{ u.name }}<sc-if value=\"{{ u.self }}\"><span style=\"font-size:12px;color:var(--color-neutral-700)\"> (you)<\u002Fspan><\u002Fsc-if><\u002Fsc-raw-td>\n        <sc-raw-td>{{ u.email }}<\u002Fsc-raw-td>\n        <sc-raw-td><sc-raw-select class=\"input\" style=\"min-height:30px;padding:3px 8px;width:auto\" value=\"{{ u.role }}\" disabled=\"{{ u.self }}\" sc-camel-on-change=\"{{ u.onRole }}\" aria-label=\"Role\"><option value=\"marketer\">Marketer<\u002Foption><option value=\"admin\">Admin<\u002Foption><\u002Fsc-raw-select><\u002Fsc-raw-td>\n        <sc-raw-td><span class=\"tag {{ u.statusClass }}\">{{ u.status }}<\u002Fspan><\u002Fsc-raw-td>\n        <sc-raw-td style=\"text-align:right\"><button class=\"btn btn-secondary\" style=\"padding:4px 10px\" disabled=\"{{ u.self }}\" sc-camel-on-click=\"{{ u.toggle }}\">{{ u.toggleLabel }}<\u002Fbutton><\u002Fsc-raw-td>\n      <\u002Fsc-raw-tr><\u002Fsc-for><\u002Fsc-raw-tbody>\n    <\u002Fsc-raw-table><\u002Fdiv>\n  <\u002Fmain>\n  <\u002Fsc-if>\n\n  <sc-if value=\"{{ isAudit }}\">\n  <main style=\"padding:24px;width:100%;max-width:1200px;margin:0 auto;display:flex;flex-direction:column;gap:22px;box-sizing:border-box\">\n    <div><h1 style=\"margin:0;font-size:38px\">Audit log<\u002Fh1><div style=\"font-size:14px;color:var(--color-neutral-700)\">Sensitive actions, newest first. Read only.<\u002Fdiv><\u002Fdiv>\n    <div style=\"overflow-x:auto\"><sc-raw-table class=\"table\">\n      <sc-raw-thead><sc-raw-tr><sc-raw-th>Date<\u002Fsc-raw-th><sc-raw-th>Author<\u002Fsc-raw-th><sc-raw-th>Action<\u002Fsc-raw-th><sc-raw-th>Target<\u002Fsc-raw-th><sc-raw-th>Details<\u002Fsc-raw-th><\u002Fsc-raw-tr><\u002Fsc-raw-thead>\n      <sc-raw-tbody><sc-for list=\"{{ auditRows }}\" as=\"a\" hint-placeholder-count=\"5\"><sc-raw-tr><sc-raw-td style=\"white-space:nowrap;font-variant-numeric:tabular-nums\">{{ a.date }}<\u002Fsc-raw-td><sc-raw-td>{{ a.actor }}<\u002Fsc-raw-td><sc-raw-td><code style=\"font-size:12px\">{{ a.action }}<\u002Fcode><\u002Fsc-raw-td><sc-raw-td>{{ a.target }}<\u002Fsc-raw-td><sc-raw-td style=\"font-size:13px;color:var(--color-neutral-700)\">{{ a.details }}<\u002Fsc-raw-td><\u002Fsc-raw-tr><\u002Fsc-for><\u002Fsc-raw-tbody>\n    <\u002Fsc-raw-table><\u002Fdiv>\n  <\u002Fmain>\n  <\u002Fsc-if>\n\n  <footer style=\"margin-top:auto;padding:14px 24px;display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;font-size:11px;color:var(--color-neutral-700);border-top:1px solid var(--color-divider)\"><span>SN ADS · Soro Nua Agency<\u002Fspan><span style=\"font-variant-numeric:tabular-nums\">Release 1.0.0 · a1b2c3d<\u002Fspan><\u002Ffooter>\n<\u002Fdiv>\n\n<sc-if value=\"{{ saveOpen }}\">\n  <div class=\"dialog-backdrop\" sc-camel-on-click=\"{{ closeDialogs }}\" style=\"z-index:40;overflow-y:auto\">\n    <div class=\"dialog blueprint\" role=\"dialog\" aria-modal=\"true\" aria-label=\"Save prediction\" style=\"background:var(--color-bg);box-shadow:var(--shadow-lg)\" sc-camel-on-click=\"{{ stop }}\">\n      <i class=\"corner tl\"><\u002Fi><i class=\"corner tr\"><\u002Fi><i class=\"corner bl\"><\u002Fi><i class=\"corner br\"><\u002Fi>\n      <div class=\"dialog-title\">Save prediction<\u002Fdiv>\n      <div class=\"field\"><label for=\"save-label\">Name (optional)<\u002Flabel><input id=\"save-label\" class=\"input\" sc-camel-max-length=\"120\" value=\"{{ saveLabel }}\" sc-camel-on-change=\"{{ onSaveLabel }}\" placeholder=\"e.g. Black Friday email\"><div style=\"font-size:11px;color:var(--color-neutral-700);margin-top:4px;text-align:right\">{{ saveCount }} / 120<\u002Fdiv><\u002Fdiv>\n      <div class=\"dialog-actions\"><button class=\"btn btn-secondary\" sc-camel-on-click=\"{{ closeDialogs }}\">Cancel<\u002Fbutton><button class=\"btn btn-primary\" sc-camel-on-click=\"{{ doSave }}\">Save prediction<\u002Fbutton><\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsc-if>\n\n<sc-if value=\"{{ uploadOpen }}\">\n  <div class=\"dialog-backdrop\" sc-camel-on-click=\"{{ closeDialogs }}\" style=\"z-index:40;overflow-y:auto\">\n    <div class=\"dialog blueprint\" role=\"dialog\" aria-modal=\"true\" aria-label=\"Upload CSV\" style=\"width:min(560px,100%);background:var(--color-bg);box-shadow:var(--shadow-lg)\" sc-camel-on-click=\"{{ stop }}\">\n      <i class=\"corner tl\"><\u002Fi><i class=\"corner tr\"><\u002Fi><i class=\"corner bl\"><\u002Fi><i class=\"corner br\"><\u002Fi>\n      <div class=\"dialog-title\">Upload agency data<\u002Fdiv>\n      <div style=\"font-size:13px;padding:10px 12px;border:1px solid var(--color-divider)\">Amounts must be in USD. Rates must be fractions between 0 and 1 (0.05 = 5%). One row per campaign, described by the typical person it targets.<\u002Fdiv>\n      <label style=\"display:flex;flex-direction:column;align-items:center;gap:6px;padding:20px;border:1px dashed var(--color-accent);cursor:pointer;font-size:14px;color:var(--color-accent-800)\" style-hover=\"background:var(--color-accent-100)\">\n        <input type=\"file\" accept=\".csv,text/csv\" sc-camel-on-change=\"{{ onFile }}\" style=\"position:absolute;opacity:0;width:1px;height:1px\">\n        <svg width=\"22\" height=\"22\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.5\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4\"><\u002Fpath><polyline points=\"17 8 12 3 7 8\"><\u002Fpolyline><line x1=\"12\" y1=\"3\" x2=\"12\" y2=\"15\"><\u002Fline><\u002Fsvg>\n        <span>{{ upFileLabel }}<\u002Fspan><span style=\"font-size:11px;color:var(--color-neutral-700)\">CSV, same columns as the starting dataset · 10 MB max<\u002Fspan>\n      <\u002Flabel>\n      <label style=\"display:flex;gap:8px;align-items:flex-start;font-size:14px;cursor:pointer\"><input type=\"checkbox\" checked=\"{{ upAnon }}\" sc-camel-on-change=\"{{ onAnon }}\" style=\"margin-top:3px\">I confirm that client names are anonymized in this file.<\u002Flabel>\n      <sc-if value=\"{{ upMsg }}\"><div role=\"alert\" style=\"padding:10px 12px;border:1px solid var(--color-accent-700);background:var(--color-accent-100);color:var(--color-accent-900);font-size:13px\">{{ upMsg }}<\u002Fdiv><\u002Fsc-if>\n      <sc-if value=\"{{ hasUpErrors }}\">\n        <div style=\"max-height:200px;overflow:auto;border:1px solid var(--color-divider)\"><sc-raw-table class=\"table\" style=\"font-size:12px\"><sc-raw-thead><sc-raw-tr><sc-raw-th>Row<\u002Fsc-raw-th><sc-raw-th>Column<\u002Fsc-raw-th><sc-raw-th>Problem<\u002Fsc-raw-th><\u002Fsc-raw-tr><\u002Fsc-raw-thead><sc-raw-tbody><sc-for list=\"{{ upErrors }}\" as=\"e\"><sc-raw-tr><sc-raw-td style=\"font-variant-numeric:tabular-nums\">{{ e.row }}<\u002Fsc-raw-td><sc-raw-td><code>{{ e.col }}<\u002Fcode><\u002Fsc-raw-td><sc-raw-td>{{ e.msg }}<\u002Fsc-raw-td><\u002Fsc-raw-tr><\u002Fsc-for><\u002Fsc-raw-tbody><\u002Fsc-raw-table><\u002Fdiv>\n        <div style=\"font-size:12px;color:var(--color-neutral-700)\">Nothing was imported. Fix the file and upload it again.<\u002Fdiv>\n      <\u002Fsc-if>\n      <div class=\"dialog-actions\"><button class=\"btn btn-secondary\" sc-camel-on-click=\"{{ closeDialogs }}\">Cancel<\u002Fbutton><button class=\"btn btn-primary\" disabled=\"{{ upBusy }}\" sc-camel-on-click=\"{{ doUpload }}\">{{ upBtn }}<\u002Fbutton><\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsc-if>\n\n<sc-if value=\"{{ trainOpen }}\">\n  <div class=\"dialog-backdrop\" sc-camel-on-click=\"{{ closeDialogs }}\" style=\"z-index:40;overflow-y:auto\">\n    <div class=\"dialog blueprint\" role=\"dialog\" aria-modal=\"true\" aria-label=\"Train a new version\" style=\"background:var(--color-bg);box-shadow:var(--shadow-lg)\" sc-camel-on-click=\"{{ stop }}\">\n      <i class=\"corner tl\"><\u002Fi><i class=\"corner tr\"><\u002Fi><i class=\"corner bl\"><\u002Fi><i class=\"corner br\"><\u002Fi>\n      <div class=\"dialog-title\">Train a new version<\u002Fdiv>\n      <div style=\"font-size:13px;color:var(--color-neutral-700)\">Trains three models (one per figure) on the rows ready now, then tests them on held-out rows.<\u002Fdiv>\n      <div style=\"display:flex;flex-direction:column;gap:10px\">\n        <label class=\"radio\"><input type=\"radio\" name=\"scope\" checked=\"{{ scopeAll }}\" sc-camel-on-change=\"{{ pickAll }}\"><span class=\"dot\"><\u002Fspan>All data <span style=\"font-size:12px;color:var(--color-neutral-700)\">— starting dataset + agency rows<\u002Fspan><\u002Flabel>\n        <label class=\"radio\" style=\"opacity:{{ agencyOpacity }}\"><input type=\"radio\" name=\"scope\" checked=\"{{ scopeAgency }}\" disabled=\"{{ agencyDisabled }}\" sc-camel-on-change=\"{{ pickAgency }}\"><span class=\"dot\"><\u002Fspan>Agency data only<\u002Flabel>\n        <sc-if value=\"{{ agencyDisabled }}\"><div style=\"font-size:12px;color:var(--color-neutral-700);margin-left:24px\">Requires at least 250 agency rows.<\u002Fdiv><\u002Fsc-if>\n      <\u002Fdiv>\n      <div class=\"dialog-actions\"><button class=\"btn btn-secondary\" sc-camel-on-click=\"{{ closeDialogs }}\">Cancel<\u002Fbutton><button class=\"btn btn-primary\" sc-camel-on-click=\"{{ startTrain }}\">Start training<\u002Fbutton><\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsc-if>\n\n<sc-if value=\"{{ inviteOpen }}\">\n  <div class=\"dialog-backdrop\" sc-camel-on-click=\"{{ closeDialogs }}\" style=\"z-index:40;overflow-y:auto\">\n    <div class=\"dialog blueprint\" role=\"dialog\" aria-modal=\"true\" aria-label=\"Invite user\" style=\"background:var(--color-bg);box-shadow:var(--shadow-lg)\" sc-camel-on-click=\"{{ stop }}\">\n      <i class=\"corner tl\"><\u002Fi><i class=\"corner tr\"><\u002Fi><i class=\"corner bl\"><\u002Fi><i class=\"corner br\"><\u002Fi>\n      <div class=\"dialog-title\">Invite user<\u002Fdiv>\n      <div class=\"field\"><label for=\"inv-email\">Email<\u002Flabel><input id=\"inv-email\" class=\"input\" type=\"email\" value=\"{{ inv.email }}\" sc-camel-on-change=\"{{ onInvEmail }}\"><\u002Fdiv>\n      <div class=\"field\"><label for=\"inv-name\">Full name<\u002Flabel><input id=\"inv-name\" class=\"input\" value=\"{{ inv.name }}\" sc-camel-on-change=\"{{ onInvName }}\"><\u002Fdiv>\n      <div class=\"field\"><label for=\"inv-role\">Role<\u002Flabel><sc-raw-select id=\"inv-role\" class=\"input\" value=\"{{ inv.role }}\" sc-camel-on-change=\"{{ onInvRole }}\"><option value=\"marketer\">Marketer<\u002Foption><option value=\"admin\">Admin<\u002Foption><\u002Fsc-raw-select><\u002Fdiv>\n      <sc-if value=\"{{ invErr }}\"><div role=\"alert\" style=\"font-size:13px;font-weight:500;color:var(--color-accent-800)\">{{ invErr }}<\u002Fdiv><\u002Fsc-if>\n      <div class=\"dialog-actions\"><button class=\"btn btn-secondary\" sc-camel-on-click=\"{{ closeDialogs }}\">Cancel<\u002Fbutton><button class=\"btn btn-primary\" sc-camel-on-click=\"{{ doInvite }}\">Send invitation<\u002Fbutton><\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsc-if>\n\n<sc-if value=\"{{ toast }}\">\n  <div role=\"status\" class=\"blueprint\" style=\"position:fixed;left:50%;bottom:28px;transform:translateX(-50%);padding:10px 18px;background:var(--color-accent-900);color:var(--color-bg);font-size:14px;box-shadow:var(--shadow-md);z-index:50\"><i class=\"corner tl\"><\u002Fi><i class=\"corner tr\"><\u002Fi><i class=\"corner bl\"><\u002Fi><i class=\"corner br\"><\u002Fi>{{ toast }}<\u002Fdiv>\n<\u002Fsc-if>\n<\u002Fsc-if>\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\" data-props=\"{&quot;role&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;admin&quot;,&quot;marketer&quot;],&quot;default&quot;:&quot;admin&quot;,&quot;tsType&quot;:&quot;'admin'|'marketer'&quot;,&quot;section&quot;:&quot;Session&quot;},&quot;startSignedIn&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:true,&quot;tsType&quot;:&quot;boolean&quot;,&quot;section&quot;:&quot;Session&quot;},&quot;activeModel&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:true,&quot;tsType&quot;:&quot;boolean&quot;,&quot;section&quot;:&quot;System state&quot;},&quot;csvOutcome&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;valid&quot;,&quot;invalid&quot;,&quot;duplicate&quot;],&quot;default&quot;:&quot;valid&quot;,&quot;tsType&quot;:&quot;'valid'|'invalid'|'duplicate'&quot;,&quot;section&quot;:&quot;System state&quot;}}\">\nconst CH=['Social Media','Email','PPC','SEO','Referral'];\nconst TY=['Awareness','Consideration','Conversion','Retention'];\nconst OPTS={campaign_channel:CH,campaign_type:TY,gender:['Male','Female']};\nconst LABEL={campaign_channel:'Channel',campaign_type:'Campaign type',ad_spend:'Ad spend (USD)',age:'Age',gender:'Gender',income:'Income (USD / year)',previous_purchases:'Previous purchases',loyalty_points:'Loyalty points',pages_per_visit:'Pages per visit',time_on_site:'Time on site (minutes)',social_shares:'Social shares',email_opens:'Email opens',email_clicks:'Email clicks'};\nconst LIM={ad_spend:[0,1e7],age:[18,100],income:[0,1e8],previous_purchases:[0,1e4],loyalty_points:[0,1e7],pages_per_visit:[0,1000],time_on_site:[0,1440],social_shares:[0,1e7],email_opens:[0,1e7],email_clicks:[0,1e7]};\nconst INT=['age','income','previous_purchases','loyalty_points','social_shares','email_opens','email_clicks'];\nconst RANGE={ad_spend:[100.05,9997.91],age:[18,69],income:[20014,149986],previous_purchases:[0,9],loyalty_points:[0,4999],pages_per_visit:[1,9.99],time_on_site:[0.5,14.99],social_shares:[0,99],email_opens:[0,19],email_clicks:[0,9]};\nconst GROUPS=[['01','Campaign plan','Known before launch',['campaign_channel','campaign_type','ad_spend']],['02','Target audience profile','The typical person targeted',['age','gender','income','previous_purchases','loyalty_points']],['03','Expected engagement','Your estimates',['pages_per_visit','time_on_site','social_shares','email_opens','email_clicks']]];\nconst ENG=['pages_per_visit','time_on_site','social_shares','email_opens','email_clicks'];\nconst MET=['Click-through rate','Conversion rate','Website visits'];\nconst BASE=[0.1542,0.1038,24.7];\nconst LOW=41.2,HIGH=58.9;\nfunction engDefaults(ch,ty){const c=CH.indexOf(ch),t=TY.indexOf(ty);return{pages_per_visit:(5.3+c*0.12+t*0.05).toFixed(1),time_on_site:(7.4+t*0.15-c*0.06).toFixed(1),social_shares:String(48+c*2+t),email_opens:String(ch==='Email'?11:9-(c%2)),email_clicks:String(ch==='Email'?5:4)};}\nconst CHE={'Social Media':[.004,.001,.6],Email:[-.003,.004,-.8],PPC:[.006,-.001,1.2],SEO:[-.002,.002,.9],Referral:[.001,.003,-.4]};\nconst TYE={Awareness:[.005,-.006,1.1],Consideration:[.002,-.001,.4],Conversion:[-.002,.007,-.6],Retention:[-.001,.003,-.3]};\nconst cl=(v,a,b)=>Math.min(b,Math.max(a,v));\nconst sig=z=>100/(1+Math.exp(-z));\nfunction evaluate(x){\n  const s=x.ad_spend-5000;\n  const T={campaign_channel:CHE[x.campaign_channel],campaign_type:TYE[x.campaign_type],\n    ad_spend:[s*1.1e-6,s*4e-7,s*3.2e-4],age:[(43-x.age)*6e-5,(x.age-43)*3e-5,(43-x.age)*.012],\n    gender:x.gender==='Female'?[.0012,.0006,.2]:[-.0012,-.0006,-.2],\n    income:[(x.income-84000)*1e-8,(x.income-84000)*2e-8,(x.income-84000)*2e-6],\n    previous_purchases:[(x.previous_purchases-4.5)*3e-4,(x.previous_purchases-4.5)*6e-4,(x.previous_purchases-4.5)*.08],\n    loyalty_points:[(x.loyalty_points-2500)*2e-7,(x.loyalty_points-2500)*6e-7,(x.loyalty_points-2500)*1e-4],\n    pages_per_visit:[(x.pages_per_visit-5.5)*4e-4,(x.pages_per_visit-5.5)*9e-4,(x.pages_per_visit-5.5)*.9],\n    time_on_site:[(x.time_on_site-7.7)*2e-4,(x.time_on_site-7.7)*8e-4,(x.time_on_site-7.7)*.35],\n    social_shares:[(x.social_shares-50)*1.5e-5,(x.social_shares-50)*5e-6,(x.social_shares-50)*.01],\n    email_opens:[(x.email_opens-9.5)*1e-4,(x.email_opens-9.5)*3e-4,(x.email_opens-9.5)*.05],\n    email_clicks:[(x.email_clicks-4.5)*2e-4,(x.email_clicks-4.5)*7e-4,(x.email_clicks-4.5)*.07]};\n  const o=[...BASE];for(const k in T)T[k].forEach((v,i)=>o[i]+=v);\n  const p=[cl(o[0],.01,.34),cl(o[1],.01,.2),cl(o[2],.5,49)];\n  const leads=p[2]*p[1],cost=leads>0?x.ad_spend/leads:null;\n  const notes=[sig((p[0]-.1542)/.012),sig((leads-2.56)/.35),cost==null?0:sig((1953-cost)/1100)];\n  const score=(notes[0]+notes[1]+notes[2])/3;\n  const level=score<LOW?'Low':score>=HIGH?'High':'Medium';\n  return {p,leads,cost,notes,score,level,T};\n}\nfunction recommend(x,base){\n  const f=v=>[...v];\n  const C={campaign_channel:CH.filter(c=>c!==x.campaign_channel),campaign_type:TY.filter(c=>c!==x.campaign_type),\n    ad_spend:[-.5,-.4,-.3,-.2,-.1,.1,.2,.3,.4,.5].map(k=>Math.round(x.ad_spend*(1+k))),\n    age:[25,35,45,55,65].filter(a=>a!==x.age),gender:[x.gender==='Male'?'Female':'Male'],\n    income:[30000,60000,90000,120000,150000].filter(a=>a!==x.income),previous_purchases:[0,2,5,8].filter(a=>a!==x.previous_purchases),\n    loyalty_points:[500,1500,3000,4500].filter(a=>a!==x.loyalty_points)};\n  const items=[];\n  for(const k in C){let best=null;for(const v of C[k]){const e=evaluate({...x,[k]:v});if(!best||e.score>best.e.score)best={k,v,e};}\n    if(best&&best.e.score-base.score>=5)items.push(best);}\n  return items.sort((a,b)=>b.e.score-a.e.score).slice(0,3);\n}\nconst pct=v=>(v*100).toFixed(2)+'%';\nconst money=(v,d=2)=>'$'+v.toLocaleString('en-US',{minimumFractionDigits:d,maximumFractionDigits:d});\nconst fmtD=d=>new Da
