name: soronua-predict

include: # reduced self-hosted Supabase stack; its variables come from deploy/supabase/.env (make env-local)
  - path: deploy/supabase/docker-compose.yml
    env_file: deploy/supabase/.env

services:
  redis: # local stand-in for Upstash; unused by app code until phase 1/2
    image: redis:7.4-alpine@sha256:858f009f9709ce576febc734aa78b8f6d624b82571f9ddb6bda4377c833b3499
    command: ["redis-server", "--save", "", "--appendonly", "no", "--maxmemory-policy", "noeviction"]
    tmpfs: ["/data"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 3s

  api:
    build: { context: ., dockerfile: apps/api/Dockerfile, target: dev }
    image: soronua-predict-api:dev
    environment: # explicit allowlist, never env_file
      SERVICE_NAME: api
      APP_ENV: ${APP_ENV:-local}
      APP_RELEASE: ${APP_RELEASE:-local}
      LOG_LEVEL: ${LOG_LEVEL:-DEBUG}
      WATCHFILES_FORCE_POLLING: "true"
      SUPABASE_URL: ${SUPABASE_URL:-http://supabase-kong:8000}
      SUPABASE_ANON_KEY: ${SUPABASE_ANON_KEY:-}
      SUPABASE_SERVICE_ROLE_KEY: ${SUPABASE_SERVICE_ROLE_KEY:-}
      SUPABASE_JWT_SECRET: ${SUPABASE_JWT_SECRET:-}
      SUPABASE_JWT_ISSUER: ${SUPABASE_JWT_ISSUER:-http://localhost:54321/auth/v1}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
      WEB_APP_URL: ${WEB_APP_URL:-http://localhost:3000}
      MODEL_DIR: /models # trained model files (named volume below)
    ports: ["127.0.0.1:${API_HOST_PORT:-8000}:8000"]
    volumes:
      - ./apps/api:/app # venv lives in /opt/venv, not hidden by the mount
      - model-data:/models
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/api/health', timeout=3).status == 200 else 1)"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 15s

  web:
    build: { context: ., dockerfile: apps/web/Dockerfile, target: dev }
    image: soronua-predict-web:dev
    environment: # allowlist: NEXT_PUBLIC_* + proxy targets only (the anon key is the one public Supabase value)
      NEXT_PUBLIC_APP_ENV: ${NEXT_PUBLIC_APP_ENV:-local}
      NEXT_PUBLIC_APP_RELEASE: ${NEXT_PUBLIC_APP_RELEASE:-local}
      NEXT_PUBLIC_SUPABASE_URL: ${NEXT_PUBLIC_SUPABASE_URL:-http://supabase-kong:8000} # server-side base URL; the browser uses its own origin
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ${SUPABASE_ANON_KEY:-}
      API_PROXY_TARGET: ${API_PROXY_TARGET:-http://api:8000}
      AUTH_PROXY_TARGET: ${AUTH_PROXY_TARGET:-http://supabase-kong:8000} # local only: /auth/v1/* proxy (D-069)
      NEXT_TELEMETRY_DISABLED: "1"
      WATCHPACK_POLLING: "true"
    ports: ["127.0.0.1:${WEB_HOST_PORT:-3000}:3000"]
    volumes:
      - ./apps/web:/app
      - /app/node_modules # keep the image's Linux node_modules / build cache
      - /app/.next
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/healthz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 40s
    # NO depends_on api: the page must stay up and show "API: unreachable" when api is stopped

  cli: # operations commands (bootstrap_admin, create_test_users): closed-list holder of the service key with api (D-072)
    build: { context: ., dockerfile: apps/api/Dockerfile, target: dev }
    image: soronua-predict-api:dev
    profiles: ["tools"]
    working_dir: /app
    environment: # explicit allowlist, never env_file; no port, no depends_on
      SERVICE_NAME: api
      APP_ENV: ${APP_ENV:-local}
      APP_RELEASE: ${APP_RELEASE:-local}
      LOG_LEVEL: ${LOG_LEVEL:-DEBUG}
      SUPABASE_URL: ${SUPABASE_URL:-http://supabase-kong:8000}
      SUPABASE_ANON_KEY: ${SUPABASE_ANON_KEY:-}
      SUPABASE_SERVICE_ROLE_KEY: ${SUPABASE_SERVICE_ROLE_KEY:-}
      WEB_APP_URL: ${WEB_APP_URL:-http://localhost:3000}
      FIRST_ADMIN_EMAIL: ${FIRST_ADMIN_EMAIL:-}
      FIRST_ADMIN_FULL_NAME: ${FIRST_ADMIN_FULL_NAME:-}
      E2E_ADMIN_EMAIL: ${E2E_ADMIN_EMAIL:-e2e-admin@example.test}
      E2E_ADMIN_PASSWORD: ${E2E_ADMIN_PASSWORD:-}
      E2E_ADMIN2_EMAIL: ${E2E_ADMIN2_EMAIL:-e2e-admin2@example.test}
      E2E_ADMIN2_PASSWORD: ${E2E_ADMIN2_PASSWORD:-}
      E2E_MARKETER_A_EMAIL: ${E2E_MARKETER_A_EMAIL:-e2e-marketer-a@example.test}
      E2E_MARKETER_A_PASSWORD: ${E2E_MARKETER_A_PASSWORD:-}
      E2E_MARKETER_B_EMAIL: ${E2E_MARKETER_B_EMAIL:-e2e-marketer-b@example.test}
      E2E_MARKETER_B_PASSWORD: ${E2E_MARKETER_B_PASSWORD:-}
      E2E_RESET_EMAIL: ${E2E_RESET_EMAIL:-e2e-reset@example.test}
      E2E_RESET_PASSWORD: ${E2E_RESET_PASSWORD:-}
      E2E_INVITEE_EMAIL: ${E2E_INVITEE_EMAIL:-e2e-invitee@example.test}
      SEED_CSV_PATH: /data/seed/digital_marketing_campaign_dataset.csv
      MODEL_DIR: /models # train_demo writes the first model here (same volume as the api)
      DEMO_ACCOUNTS_PATH: /demo/accounts.txt # demo_accounts keeps the generated passwords here
    volumes:
      - ./apps/api:/app
      - ./data/seed:/data/seed:ro
      - model-data:/models
      - ./.demo-accounts.txt:/demo/accounts.txt # created empty by `make demo` (git-ignored)

  toolbox:
    build: { context: ., dockerfile: tools/Dockerfile }
    image: soronua-predict-toolbox:local
    profiles: ["tools"]
    working_dir: /workspace
    init: true
    environment:
      # for `supabase migration up --db-url "$$DATABASE_URL"`: the password never appears on a command line
      DATABASE_URL: postgresql://postgres:${POSTGRES_PASSWORD:-}@supabase-db:5432/postgres?sslmode=disable
    volumes:
      - .:/workspace
      - toolbox-uv-cache:/root/.cache/uv
      - toolbox-npm-cache:/root/.npm

  pgtap: # pg_prove against supabase-db over the project network; `supabase test db` needs the Docker socket (D-048)
    image: public.ecr.aws/supabase/pg_prove:3.36@sha256:eda7c5e68719e9c8287e78c017118407b48df904a51c935f5ab6098b8c0bc6bc
    profiles: ["tools"]
    working_dir: /tests
    entrypoint: ["pg_prove"]
    environment:
      PGPASSWORD: ${POSTGRES_PASSWORD:-} # never a default secret; filled in by `make env-local`
    volumes:
      - ./supabase/tests/database:/tests:ro

  mailpit: # local mail catcher (supabase-auth sends through smtp 1025 on the project network)
    image: public.ecr.aws/supabase/mailpit:v1.30.2@sha256:37a38e48e9338cd7e89dfeb487f37b02ebfcd9cb23111bed2d345e79d37d6dd6
    restart: unless-stopped
    environment:
      MP_MAX_MESSAGES: "500"
      MP_SMTP_AUTH_ACCEPT_ANY: "1"
      MP_SMTP_AUTH_ALLOW_INSECURE: "1"
    ports: ["127.0.0.1:${MAILPIT_HOST_PORT:-54324}:8025"] # the smtp port 1025 stays internal
    healthcheck:
      test: ["CMD", "/mailpit", "readyz"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s

  notebooks: # exploratory training notebooks (D-044); never part of `make up`
    build: { context: ., dockerfile: apps/api/Dockerfile, target: notebooks }
    image: soronua-predict-notebooks:local
    profiles: ["notebooks"]
    working_dir: /work/notebooks
    init: true
    environment:
      SEED_CSV_PATH: /work/data/seed/digital_marketing_campaign_dataset.csv
    ports: ["127.0.0.1:${NOTEBOOKS_HOST_PORT:-8888}:8888"] # published only with --service-ports (make notebooks-lab)
    volumes:
      - ./notebooks:/work/notebooks
      - ./data/seed:/work/data/seed:ro

  e2e:
    build: { context: ., dockerfile: apps/web/Dockerfile, target: e2e }
    image: soronua-predict-web-e2e:local
    profiles: ["e2e"]
    working_dir: /app
    init: true
    ipc: host
    environment:
      E2E_BASE_URL: http://web:3000
      E2E_MAILPIT_URL: http://mailpit:8025
      E2E_ADMIN_EMAIL: ${E2E_ADMIN_EMAIL:-e2e-admin@example.test}
      E2E_ADMIN_PASSWORD: ${E2E_ADMIN_PASSWORD:-}
      E2E_ADMIN2_EMAIL: ${E2E_ADMIN2_EMAIL:-e2e-admin2@example.test}
      E2E_ADMIN2_PASSWORD: ${E2E_ADMIN2_PASSWORD:-}
      E2E_MARKETER_A_EMAIL: ${E2E_MARKETER_A_EMAIL:-e2e-marketer-a@example.test}
      E2E_MARKETER_A_PASSWORD: ${E2E_MARKETER_A_PASSWORD:-}
      E2E_MARKETER_B_EMAIL: ${E2E_MARKETER_B_EMAIL:-e2e-marketer-b@example.test}
      E2E_MARKETER_B_PASSWORD: ${E2E_MARKETER_B_PASSWORD:-}
      E2E_RESET_EMAIL: ${E2E_RESET_EMAIL:-e2e-reset@example.test}
      E2E_RESET_PASSWORD: ${E2E_RESET_PASSWORD:-}
      E2E_INVITEE_EMAIL: ${E2E_INVITEE_EMAIL:-e2e-invitee@example.test}
    volumes:
      - ./apps/web/e2e:/app/e2e
      - ./apps/web/playwright.config.ts:/app/playwright.config.ts:ro
      - ./apps/web/playwright-report:/app/playwright-report
      - ./apps/web/test-results:/app/test-results
    depends_on:
      web: { condition: service_healthy }
      api: { condition: service_healthy }
      mailpit: { condition: service_healthy }

volumes:
  model-data:
  toolbox-uv-cache:
  toolbox-npm-cache:
