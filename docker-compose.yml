name: soronua-predict

services:
  redis: # local stand-in for Upstash; unused by app code until phase 1/2
    image: redis:7.4-alpine@sha256:858f009f9709ce576febc734aa78b8f6d624b82571f9ddb6bda4377c833b3499
    command: ["redis-server", "--save", "", "--appendonly", "no", "--maxmemory-policy", "noeviction"]
    tmpfs: ["/data"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 3s

  api:
    build: { context: ., dockerfile: apps/api/Dockerfile, target: dev }
    image: soronua-predict-api:dev
    environment: # explicit allowlist, never env_file
      SERVICE_NAME: api
      APP_ENV: ${APP_ENV:-local}
      APP_RELEASE: ${APP_RELEASE:-local}
      LOG_LEVEL: ${LOG_LEVEL:-DEBUG}
      WATCHFILES_FORCE_POLLING: "true"
    ports: ["127.0.0.1:${API_HOST_PORT:-8000}:8000"]
    volumes:
      - ./apps/api:/app # venv lives in /opt/venv, not hidden by the mount
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/api/health', timeout=3).status == 200 else 1)"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 15s

  web:
    build: { context: ., dockerfile: apps/web/Dockerfile, target: dev }
    image: soronua-predict-web:dev
    environment: # allowlist: NEXT_PUBLIC_* + proxy target only
      NEXT_PUBLIC_APP_ENV: ${NEXT_PUBLIC_APP_ENV:-local}
      NEXT_PUBLIC_APP_RELEASE: ${NEXT_PUBLIC_APP_RELEASE:-local}
      API_PROXY_TARGET: ${API_PROXY_TARGET:-http://api:8000}
      NEXT_TELEMETRY_DISABLED: "1"
      WATCHPACK_POLLING: "true"
    ports: ["127.0.0.1:${WEB_HOST_PORT:-3000}:3000"]
    volumes:
      - ./apps/web:/app
      - /app/node_modules # keep the image's Linux node_modules / build cache
      - /app/.next
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/healthz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 40s
    # NO depends_on api: the page must stay up and show "API: unreachable" when api is stopped

  toolbox:
    build: { context: ., dockerfile: tools/Dockerfile }
    image: soronua-predict-toolbox:local
    profiles: ["tools"]
    working_dir: /workspace
    init: true
    volumes:
      - .:/workspace
      - toolbox-uv-cache:/root/.cache/uv
      - toolbox-npm-cache:/root/.npm

  pgtap: # pg_prove against supabase-db over the project network; `supabase test db` needs the Docker socket (D-048)
    image: public.ecr.aws/supabase/pg_prove:3.36@sha256:eda7c5e68719e9c8287e78c017118407b48df904a51c935f5ab6098b8c0bc6bc
    profiles: ["tools"]
    working_dir: /tests
    entrypoint: ["pg_prove"]
    environment:
      PGPASSWORD: ${POSTGRES_PASSWORD:-} # never a default secret; filled in by `make env-local`
    volumes:
      - ./supabase/tests/database:/tests:ro

  notebooks: # exploratory training notebooks (D-044); never part of `make up`
    build: { context: ., dockerfile: apps/api/Dockerfile, target: notebooks }
    image: soronua-predict-notebooks:local
    profiles: ["notebooks"]
    working_dir: /work/notebooks
    init: true
    environment:
      SEED_CSV_PATH: /work/data/seed/digital_marketing_campaign_dataset.csv
    ports: ["127.0.0.1:${NOTEBOOKS_HOST_PORT:-8888}:8888"] # published only with --service-ports (make notebooks-lab)
    volumes:
      - ./notebooks:/work/notebooks
      - ./data/seed:/work/data/seed:ro

  e2e:
    build: { context: ., dockerfile: apps/web/Dockerfile, target: e2e }
    image: soronua-predict-web-e2e:local
    profiles: ["e2e"]
    working_dir: /app
    init: true
    ipc: host
    environment:
      E2E_BASE_URL: http://web:3000
    volumes:
      - ./apps/web/e2e:/app/e2e
      - ./apps/web/playwright.config.ts:/app/playwright.config.ts:ro
      - ./apps/web/playwright-report:/app/playwright-report
      - ./apps/web/test-results:/app/test-results
    depends_on:
      web: { condition: service_healthy }
      api: { condition: service_healthy }

volumes:
  toolbox-uv-cache:
  toolbox-npm-cache:
